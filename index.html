<style>
  :root {
    color-scheme: light;
    /* Tone Trắng + Xanh dương. (Tên biến --pine giữ nguyên để không vỡ code cũ, nhưng giờ là màu xanh chủ đạo) */
    --bg:#F8FAFC; --surface:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9; --act-bg:#E0F2FE; --act-ink:#0B3A8F; --act-line:#7DB8F0;
    --pine:#2563EB; --pine-ink:#FFFFFF; --gold:#F5B72E;
    --berry:#C4283A; --berry-bg:#FEECEE; --berry-line:#F5A9B2;
    --ok-bg:#E2F5EA; --ok:#157A3E; --wait-bg:#FFF4D6; --wait:#8A5A00;

  }
  html { scroll-padding-top: env(safe-area-inset-top,0px); }
  body { background:var(--bg); color:var(--ink); font-family:'Be Vietnam Pro',system-ui,sans-serif; }
  .surface { background:var(--surface); border:1px solid var(--line); box-shadow:none; }
  .muted { color:var(--muted); }
  .btn-pine { background:var(--act-bg); color:var(--act-ink); border:1.5px solid var(--act-line); }
  .btn-pine:disabled { background:var(--line); color:var(--muted); border-color:var(--line); cursor:not-allowed; }
  .btn-danger { background:var(--berry); color:var(--surface); }
  .btn-outline { border:1.5px solid var(--line); color:var(--ink); }
  .field { background:var(--bg); border:1px solid var(--line); color:var(--ink); }
  .field:focus { outline:2px solid var(--pine); outline-offset:1px; }
  .chip { border:1px solid var(--line); background:var(--surface); }
  .chip[aria-pressed="true"] { background:var(--act-bg); color:var(--act-ink); border-color:var(--pine); box-shadow:0 0 0 1px var(--pine) inset; }
  .type-card { border:1.5px solid var(--line); background:var(--surface); }
  .type-card[aria-checked="true"] { border-color:var(--pine); box-shadow:0 0 0 2px var(--pine) inset; }
  .type-card[data-sensitive="true"][aria-checked="true"] { border-color:var(--berry); box-shadow:0 0 0 2px var(--berry) inset; }
  .warn { background:var(--berry-bg); border:1px solid var(--berry-line); color:var(--berry); }
  .badge-ok { background:var(--ok-bg); color:var(--ok); }
  .badge-wait { background:var(--wait-bg); color:var(--wait); }
  .badge-bad { background:var(--berry-bg); color:var(--berry); }
  .admin-tag { background:var(--gold); color:#3A2A00; }
  .badge-photo { background:var(--act-bg); color:var(--act-ink); }
  .nav-item { min-height:48px; color:var(--ink); }
  .nav-item[aria-current="true"] { background:var(--act-bg); color:var(--act-ink); box-shadow:0 0 0 1.5px var(--act-line) inset; }
  .nav-item:active { background:var(--soft); }
  .nav-item[data-soon] { color:var(--muted); }
  .subj-toan, .subj-van, .subj-anh, .subj-tin { background:var(--soft); color:var(--ink); border:1px solid var(--line); }

  /* ===== Cảm ứng: bỏ trễ chạm, vùng bấm ≥ 44px, phản hồi tức thì ===== */
  html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, label.chip, select, [role="radio"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; user-select: none; -webkit-user-select: none; }
  button { min-height: 44px; min-width: 44px; }

  button.no-min::after { content: ''; position: absolute; inset: -10px; }

  /* PK */
  .pk-opt { min-height:48px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:14px; font-weight:600; line-height:1.2; }

  .pk-ans b { flex:none; width:24px; height:24px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:12px; background:var(--soft); color:var(--ink); }
  .pk-ans[aria-pressed="true"] { background:var(--act-bg); border-color:var(--pine); color:var(--act-ink); box-shadow:0 0 0 1px var(--pine) inset; }
  .pk-clock { font-variant-numeric:tabular-nums; font-size:26px; font-weight:800; letter-spacing:-.5px; }
  .pk-clock.pk-warn { color:var(--berry); animation:pkpulse 1s ease-in-out infinite; }
  @keyframes pkpulse { 50% { opacity:.55; } }
  .pk-bar { position:fixed; left:0; right:0; bottom:0; z-index:35; background:var(--surface); border-top:1px solid var(--line); padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px); }
  .pk-num { width:36px; min-width:36px; min-height:36px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-weight:600; background:var(--surface); }
  .pk-num[data-done="true"] { background:var(--soft); }
  .pk-num[aria-current="true"] { border-color:var(--pine); box-shadow:0 0 0 1px var(--pine) inset; color:var(--pine); }
  .pk-room { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:34px; font-weight:800; letter-spacing:.18em; }
  .pk-play .tabbar { display:none; }

  /* Thanh tab dưới (mobile) */
  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px); }
  .chip-sm { min-height:36px; }
  .act-btn { min-height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); }
  .act-btn[aria-pressed="true"] { background:var(--act-bg); color:var(--act-ink); }
  .hscroll::-webkit-scrollbar { display:none; }
  .tab { min-height:50px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:10.5px; font-weight:600; color:var(--muted); }
  .tab .tab-ico { position:relative; width:40px; height:24px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .tab[aria-current="true"] { color:var(--pine); font-weight:700; }
  .tab[aria-current="true"] .tab-ico { background:var(--act-bg); color:var(--act-ink); box-shadow:0 0 0 1px var(--act-line) inset; }
  @keyframes pop { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }

/* ===== 3.2b: giao diện hiện đại nền sáng ===== */
:root { --bg:#F5F7FB; --surface:#FFFFFF; --ink:#0B1220; --muted:#667085; --line:#E6EAF2; --soft:#EEF2F9; --act-bg:#EAF1FF; --act-ink:#1A47C8; --act-line:#BBD0FB; --pine:#2F6BFF; --ok-bg:#E6F6EE; --ok:#0F7A43; --wait-bg:#FFF3D6; --wait:#8A5A00; --berry:#D92D45; --berry-bg:#FEECEF; --berry-line:#F7B4BE; --r-card:20px; --r-btn:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px rgba(16,24,40,.06); }

.btn-pine:not(.rounded-full) { background:linear-gradient(180deg,#4D86FF 0%,#2F6BFF 100%); color:#fff; border:1.5px solid transparent; border-radius:var(--r-btn); font-weight:700; min-height:46px; box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 6px 16px rgba(47,107,255,.28); }

.btn-outline[style*="--berry"] { background:var(--berry-bg); }

@media (hover:hover) {
  .btn-pine:not(:disabled):hover { filter:brightness(1.06); transform:translateY(-1px); }
  .btn-outline:not(:disabled):hover { background:var(--soft); }

}
button:focus-visible, a:focus-visible { outline:3px solid rgba(47,107,255,.35); outline-offset:2px; }
button[data-loading]::before { content:''; display:inline-block; width:15px; height:15px; margin-right:8px; vertical-align:-3px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:gspin .7s linear infinite; }
@keyframes gspin { to { transform:rotate(360deg); } }
.chip { border-radius:999px; background:#fff; box-shadow:0 1px 2px rgba(16,24,40,.04); }

#app .field { background:#fff; border:1.5px solid var(--line); border-radius:14px; }
#app .field:focus { outline:0; border-color:var(--pine); box-shadow:0 0 0 4px rgba(47,107,255,.14); }

.res-reward-off { background:var(--soft); border-color:var(--line); }
</style>

<body class="min-h-screen">
<div id="app" class="mx-auto max-w-2xl min-h-screen relative"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-20 z-[80] hidden px-4 py-2 rounded-full text-sm font-medium shadow-lg" style="background:var(--ink);color:var(--bg)"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp, writeBatch, getDocs, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 0. FIREBASE & PHÂN QUYỀN ===== */
const firebaseConfig = {            // Firebase Console → Project settings → Your apps (Web)
  apiKey: "AIzaSyACh4k9ZAaEkvvHXBAg1_2IovJ5ATPCs-A",
  authDomain: "goconthi-57c98.firebaseapp.com",
  projectId: "goconthi-57c98",
  appId: "1:812551550808:web:54cf19cf0d676d8739172d"
};
const ADMIN_EMAILS = [              // Email Google của quản trị viên (Thành Thông). Trùng email là tự động có quyền Admin
  'thanhthongboy@gmail.com'         // (Firestore Rules cũng kiểm tra đúng email này ở phía máy chủ)
];
const FIREBASE_READY = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
let auth = null, db = null;

/* ===== 1. Cấu hình ===== */
const SUBJECTS = { toan:'Toán', van:'Ngữ Văn', anh:'Tiếng Anh', tin:'Tin học' };
const TYPES = {
  practice:{ label:'Đề thi thử / Tự luyện', sensitive:false, hint:'Đăng công khai ngay' },
  semester:{ label:'Đề học kỳ', sensitive:true, hint:'Cần kiểm duyệt' },
  thptqg:{ label:'Đề THPTQG', sensitive:true, hint:'Cần kiểm duyệt' },
  dgnl:{ label:'Đề ĐGNL', sensitive:true, hint:'Cần kiểm duyệt' }
};
const MIN = 60000, HOUR = 3600000, DAY = 24 * HOUR;
const normEmail = e => String(e || '').trim().toLowerCase();
const isAdminEmail = e => ADMIN_EMAILS.map(normEmail).includes(normEmail(e));


/* ===== 2. Trạng thái (dữ liệu lấy real-time từ Firestore, dùng chung cho mọi thiết bị) ===== */
const state = { me:null, profile:null, view:'feed', filter:'all', adminTab:'queue', users:[], posts:[], inactiveDays:30, scanned:false, lastPurge:null, loginError:'', dbError:'', noticeErr:'', notices:[], noticeOpen:false, noticePrev:0, apps:[], myApp:null, appErr:'', appFilter:'pending', feedback:[], fbType:'gop-y', open:new Set(), subs:{}, draft:{}, draftImgs:{}, pendingRender:false, ready:{ posts:false, users:false, apps:false } };
const me = () => state.profile;
const isAdmin = () => !!state.profile && state.profile.role === 'admin';
const errBanner = () => state.dbError ? `<div class="warn rounded-xl p-3 text-sm mb-3" role="alert">${esc(state.dbError)}</div>` : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ts) {
  const d = Date.now() - ts;
  if (d < MIN) return 'Vừa xong';
  if (d < HOUR) return Math.floor(d/MIN) + ' phút trước';
  if (d < 24*HOUR) return Math.floor(d/HOUR) + ' giờ trước';
  return new Date(ts).toLocaleDateString('vi-VN');
}
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2800);
}
const adminTag = '<span class="admin-tag text-[10px] font-extrabold px-1.5 py-0.5 rounded">ADMIN</span>';
const modTag = '<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded" style="background:var(--act-bg);color:var(--act-ink);border:1px solid var(--act-line)">CTV</span>';
const roleTag = r => r === 'admin' ? adminTag : r === 'mod' ? modTag : '';
const isMod = () => !!state.profile && state.profile.role === 'mod';     // cộng tác viên: chỉ duyệt/ẩn/xóa bài
const isStaff = () => isAdmin() || isMod();                              // isAdmin() = Admin gốc (theo email) mới cấp/thu hồi quyền

/* Hộp xác nhận ngay trong trang (confirm() của trình duyệt hay bị chặn trong khung preview/iframe nên nút tưởng như đơ) */
let lastAct = 0;
function askConfirm(msg, okLabel, tone) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-4';
    wrap.style.background = 'rgba(0,0,0,.6)';
    wrap.innerHTML = `<div class="surface pop rounded-2xl p-5 w-full max-w-sm" role="alertdialog" aria-modal="true"><p class="text-sm whitespace-pre-line">${esc(msg)}</p><div class="mt-4 flex gap-2 justify-end"><button type="button" data-no class="btn-outline rounded-lg px-4 py-2 text-sm font-semibold">Hủy</button><button type="button" data-yes class="${tone === 'pine' ? 'btn-pine' : 'btn-danger'} rounded-lg px-4 py-2 text-sm font-semibold">${esc(okLabel || 'Đồng ý')}</button></div></div>`;
    const done = v => { wrap.remove(); resolve(v); };
    wrap.onclick = e => { if (e.target.closest('[data-yes]')) done(true); else if (e.target === wrap || e.target.closest('[data-no]')) done(false); };
    document.body.appendChild(wrap);
  });
}
/* Cập nhật mềm: chỉ vẽ lại phần nội dung đang xem, giữ nguyên vị trí cuộn, không dựng lại header/thanh điều hướng */
function updatePendingBadge() {
  const n = state.posts.filter(p => p.status === 'pending').length;
  const b = document.getElementById('navBadge'); if (b) { b.textContent = n; b.classList.toggle('hidden', !n); }
  const d = document.getElementById('menuDot'); if (d) d.classList.toggle('hidden', !(n && isStaff()));
}
function softRender() {
  const ae = document.activeElement;
  if (state.view === 'feed' && ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName) && ae.closest('#view')) { state.pendingRender = true; updatePendingBadge(); return; }
  state.pendingRender = false;
  const y = window.scrollY;
  updatePendingBadge();
  if (state.view === 'feed') renderFeed(); else if (state.view === 'admin') renderAdmin();
  window.scrollTo(0, y);
}

/* Popup trên trình duyệt thường; app đã thêm vào màn hình chính (PWA) hoặc popup bị chặn thì tự chuyển sang redirect */
async function googleSignIn(btn) {
  const label = btn.querySelector('span'); btn.disabled = true; label.textContent = 'Đang mở Google…';
  const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt:'select_account' });
  try {
    if (isStandalone()) { await signInWithRedirect(auth, provider); return; }
    await signInWithPopup(auth, provider);
  } catch (err) {
    let e = err;
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(err.code)) {
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
    }
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') renderLogin();
    else renderLogin(authErrorText(e));
  }
}

const toMs = v => (v && v.toMillis ? v.toMillis() : (typeof v === 'number' ? v : 0));
const mapDocs = snap => snap.docs.map(d => { const x = d.data({ serverTimestamps:'estimate' }); return { ...x, id:d.id, ts:toMs(x.createdAt), joined:toMs(x.joined), lastActive:toMs(x.lastActive) }; });
const bag = { approved:[], mine:[], all:[] };
let unsubs = [];
function stopListeners() {
  unsubs.forEach(u => u()); unsubs = [];
  bag.approved = []; bag.mine = []; bag.all = []; state.posts = []; state.users = []; state.notices = []; state.apps = []; state.myApp = null; state.feedback = []; closeSubs(); state.ready = { posts:false, users:false, apps:false };
}
function rebuildPosts() {   // học sinh chỉ thấy bài đã duyệt + bài của chính mình; admin thấy tất cả
  if (isStaff()) state.posts = bag.all.slice();
  else { const m = new Map(); [...bag.approved, ...bag.mine].forEach(p => m.set(p.id, p)); state.posts = [...m.values()]; }
  state.posts.sort((a, b) => b.ts - a.ts);
}
function startListeners() {
  stopListeners();
  const uid = state.me, posts = collection(db, 'posts');
  const onErr = err => { console.error(err); state.dbError = dbErrorText(err); softRender(); };
  const got = key => { state.ready[key] = true; state.dbError = ''; rebuildPosts(); softRender(); };
  unsubs.push(onSnapshot(doc(db, 'users', uid), snap => {   // bị khóa thì đăng xuất ngay; đổi vai trò (cấp/thu hồi CTV) thì áp dụng ngay
    if (!snap.exists()) return;
    const d = snap.data();
    if (d.banned) { state.loginError = 'Tài khoản này đã bị khóa vĩnh viễn do vi phạm quy chế thi cử.'; signOut(auth); return; }
    if (!isAdminEmail(state.profile.email) && ['student', 'mod'].includes(d.role) && d.role !== state.profile.role) {
      state.profile.role = d.role; startListeners(); render();
      toast(d.role === 'mod' ? 'Bạn vừa được cấp quyền cộng tác viên duyệt bài.' : 'Quyền cộng tác viên của bạn đã được thu hồi.');
    }
  }, onErr));

  }, err => { console.error(err); state.noticeErr = dbErrorText(err); onNotices(); }));

  } else {
    let a = false, m = false;

    unsubs.push(onSnapshot(collection(db, 'users'), snap => { state.users = mapDocs(snap); got('users'); }, onErr));

}
/* Có người dùng Google (đăng nhập mới hoặc khôi phục phiên): đồng bộ hồ sơ, gán quyền theo email */
async function onGoogleUser(fb) {
  const email = normEmail(fb.email), ref = doc(db, 'users', fb.uid);
  try {
    const snap = await getDoc(ref);
    if (snap.exists() && snap.data().banned) {
      state.loginError = 'Tài khoản này đã bị khóa vĩnh viễn do vi phạm quy chế thi cử.';
      await signOut(auth); return;
    }
    const name = fb.displayName || email.split('@')[0] || 'Người dùng', root = isAdminEmail(email);
    const role = root ? 'admin' : (snap.exists() && snap.data().role === 'mod' ? 'mod' : 'student');   // CTV giữ nguyên quyền khi đăng nhập lại
    const info = { name, email, photo:toHttps(fb.photoURL), lastActive:serverTimestamp() };
    if (root) info.role = 'admin';
    if (snap.exists()) await updateDoc(ref, info); else await setDoc(ref, { ...info, role, banned:false, joined:serverTimestamp() });
    const fresh = state.me !== fb.uid;
    state.me = fb.uid; state.profile = { id:fb.uid, name, email, photo:info.photo, role };
    state.view = 'feed'; if (fresh) state.dbError = '';
    GX.wallet = null; await Promise.race([initWallet(), new Promise(r => setTimeout(r, 2500))]);   // nạp ví (localStorage + Firebase)
    startListeners(); render();
  } catch (err) {
    console.error(err); state.loginError = dbErrorText(err);
    try { await signOut(auth); } catch (e) {}
  }
}

/* Lọc sạch dấu hiệu đáp án + đọc đề 3 phần (chọn 1 đáp án · Đúng/Sai · trả lời ngắn) */
const MARK_RE = [/\[\s*ĐÁP\s*ÁN[^\]]*\]/gi, /Đáp án\s*[:：][^\n]*/gi, /Lời giải\s*[:：][^\n]*/gi, /\(\s*\*\s*\)/g, /\[\s*[xX✔✓]\s*\]/g, /\(\s*(?:đúng|sai)\s*\)/gi, /\[\s*[ĐS]\s*\]/g, /[✔✓✅☑●◉⊙⭕🔘✘✗❌]/g];
const hasMark = t => /\(\s*\*\s*\)|\[\s*[xX✔✓]\s*\]|\(\s*đúng\s*\)|[✔✓✅☑●◉⊙⭕🔘]/i.test(String(t || ''));
const cleanMarks = t => MARK_RE.reduce((x, re) => x.replace(re, ''), String(t || '')).replace(/\s{2,}/g, ' ').trim();
const truthOf = t => { const x = String(t || ''); if (/\(\s*đúng\s*\)|\[\s*Đ\s*\]|[✔✓✅☑]/i.test(x)) return true; if (/\(\s*sai\s*\)|\[\s*S\s*\]|[✘✗❌]/i.test(x)) return false; return null; };
function parseTfLine(v) {   // "a-Đ b-S c-Đ d-S" hoặc "ĐSĐS"
  const out = [null, null, null, null], str = String(v || ''), re = /([a-d])\s*[-:.)]?\s*(Đúng|Sai|Đ|S)(?![A-Za-zÀ-ỹ])/gi;
  let m; while ((m = re.exec(str))) out['abcd'.indexOf(m[1].toLowerCase())] = /^đ/i.test(m[2]);
  if (out.every(x => x === null)) { const seq = str.replace(/[^ĐSđs]/g, ''); if (seq.length === 4) seq.split('').forEach((c, i) => { out[i] = /[Đđ]/.test(c); }); }
  return out;
}
function parseBlock(raw) {
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !/^(PHẦN|Phần)\s+[IVX\d]+/.test(l));
  const stem = [], opts = [], sts = []; let ansLine = null, mkKey = null;
  for (const ln of lines) {
    if (/^(Lời giải|Giải|Hướng dẫn)\s*[:：.]/i.test(ln)) continue;
    const ak = ln.match(/^[\[(]?\s*Đáp án\s*[:：]?\s*(.+?)\s*[\])]?$/i);
    if (ak) { ansLine = ak[1].trim(); continue; }
    const ik = ln.match(/\[\s*ĐÁP\s*ÁN\s*[:：]\s*([^\]]+)\]/i); if (ik && ansLine === null) ansLine = ik[1].trim();
    const parts = /^A\s*[.):]/.test(ln) ? ln.split(/\s+(?=[B-D]\s*[.)]\s)/) : /^a\s*[.):]/.test(ln) ? ln.split(/\s+(?=[b-d]\s*[.)]\s)/) : [ln];
    for (const part of parts) {
      const om = part.match(/^([A-D])\s*[.):]\s*(.*)$/), sm = part.match(/^([a-d])\s*[.):]\s*(.*)$/);
      if (om) { const i = 'ABCD'.indexOf(om[1]); if (hasMark(om[2])) mkKey = i; opts[i] = cleanMarks(om[2]); }
      else if (sm) { const i = 'abcd'.indexOf(sm[1]); sts[i] = { x:cleanMarks(sm[2]), v:truthOf(sm[2]) }; }
      else stem.push(cleanMarks(part));
    }
  }
  const q = stem.filter(Boolean).join(' ').trim(); if (!q) return null;
  if (opts.length === 4 && opts.every(Boolean)) {   // Phần I: 4 phương án
    let key = mkKey;
    if (key === null && ansLine) { const m = ansLine.match(/^([A-D])(?![A-Za-zÀ-ỹ])/i); if (m) key = 'ABCD'.indexOf(m[1].toUpperCase()); }
    return key !== null && key >= 0 ? { t:'mcq', q, o:opts.slice(), a:key } : null;
  }
  if (sts.length === 4 && sts.every(x => x && x.x)) {   // Phần II: 4 ý Đúng/Sai
    const fl = ansLine ? parseTfLine(ansLine) : [null, null, null, null], s = sts.map((x, i) => ({ x:x.x, v:x.v !== null ? x.v : fl[i] }));
    return s.every(x => x.v === true || x.v === false) ? { t:'tf', q, s } : null;
  }
  if (!opts.length && !sts.length && ansLine) { const a = cleanMarks(ansLine); return a ? { t:'sa', q, a } : null; }   // Phần III: trả lời ngắn
  return null;
}
function parseExam(text) {   // nạp đủ cả 3 phần theo thứ tự I → II → III
  const out = [];
  try {
    const blocks = String(text || '').replace(/\r/g, '').split(/(?:^|\n)\s*(?:Câu|CÂU|Question)?\s*\d{1,3}\s*[.:)]\s+/).slice(1);
    for (const raw of blocks) { const q = parseBlock(raw); if (q) out.push(q); }
  } catch (e) { console.warn('parseExam', e); }
  const order = { mcq:0, tf:1, sa:2 };
  return out.map((q, i) => ({ q, i })).sort((a, b) => order[a.q.t] - order[b.q.t] || a.i - b.i).map(x => x.q);
}
const cleanExamText = body => String(body || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(l => l && !/^(Lời giải|Giải|Hướng dẫn|Đáp án)\s*[:：.]/i.test(l)).map(cleanMarks).filter(Boolean).join('\n');
const examKeys = qs => qs.map((q, i) => (i + 1) + ':' + (q.t === 'tf' ? q.s.map(x => x.v ? 'Đ' : 'S').join('') : q.t === 'sa' ? q.a : 'ABCD'[q.a])).join(' · ');

async function joinRoom(raw) {

async function leaveRoom() {   // hủy / thoát phòng an toàn: không trừ xu oan

    <button type="button" data-submit class="btn-outline rounded-xl px-4 font-semibold" style="color:var(--berry);border-color:var(--berry)">Nộp bài</button>
    <button type="button" data-next class="btn-pine flex-1 rounded-xl font-bold"${r.idx >= last ? ' disabled' : ''}>Câu sau</button>
  </div></div>`;
  const redo = () => pkPlayView(view);
  bindExamImgs(view, r);
  bindPkJump(view, r, redo);
  view.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { if (r.isFinished) return; r.ans[r.idx] = +b.dataset.pick; redo(); });
  view.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => {
    if (r.isFinished) return;
    const [i, v] = b.dataset.tf.split(':'), cur = Array.isArray(r.ans[r.idx]) ? r.ans[r.idx] : (r.ans[r.idx] = [null, null, null, null]), val = v === '1';
    cur[+i] = cur[+i] === val ? null : val; redo();   // bấm lại để bỏ chọn
  });
  const sa = view.querySelector('#pkSa'); if (sa) sa.oninput = () => { if (!r.isFinished) r.ans[r.idx] = sa.value; };
  view.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { r.idx = +b.dataset.goto; redo(); window.scrollTo(0, 0); });
  const pv = view.querySelector('[data-prev]'); if (pv) pv.onclick = () => { if (r.idx > 0) { r.idx--; redo(); window.scrollTo(0, 0); } };
  const nx = view.querySelector('[data-next]'); if (nx) nx.onclick = () => { if (r.idx < last) { r.idx++; redo(); window.scrollTo(0, 0); } };
  const lv = view.querySelector('[data-leave]');

  if (onEssay || !q) {
    const file = view.querySelector('#essayFile'), pickBtn = view.querySelector('[data-essaypick]');
    pickBtn.onclick = () => { pk.picking = true; setTimeout(() => { pk.picking = false; }, 90000); file.click(); };   // mở camera/thư viện không bị tính là rời tab
    file.onchange = async () => {
      for (const f of [...file.files].filter(x => x.type.startsWith('image/'))) {
        if (r.essay.imgs.length >= 5) { toast('Tối đa 5 ảnh.'); break; }
        try { r.essay.imgs.push(await compressImg(f)); } catch (er) { toast('Không đọc được ảnh.'); }
      }
      pk.picking = false; file.value = ''; redo();
    };
    view.querySelectorAll('[data-essayrm]').forEach(b => b.onclick = () => { r.essay.imgs.splice(+b.dataset.essayrm, 1); redo(); });
    const ik = view.querySelector('[data-essayink]'); if (ik) ik.onchange = () => { r.essay.inkOk = ik.checked; };
    const vi = view.querySelector('[data-essayvio]'); if (vi) vi.onchange = () => { r.essay.violation = vi.checked; };
  }
  const sm = view.querySelector('[data-submit]');
  if (sm) sm.onclick = async () => {
    const e = r.essay;
    if (r.hasEssay && !e.violation && (!e.imgs.length || !e.inkOk)) { toast('Cần tải ảnh bài làm và tick xác nhận 1 màu mực.'); r.idx = n; redo(); return; }
    const miss = r.qs.filter((x, i) => !isAnswered(x, r.ans[i])).length;
    const ok = e.violation ? await askConfirm('Bạn đã khai báo vi phạm (2 màu mực / 2 nét chữ). Nộp bài sẽ bị xử thua ngay. Tiếp tục?', 'Nộp và chịu thua')
      : await askConfirm('Nộp bài ngay? ' + (miss ? 'Bạn còn ' + miss + ' câu chưa trả lời.' : 'Bạn đã trả lời tất cả các câu.'), 'Nộp bài', 'pine');
    if (ok) finishRun('submit');
  };
}

function imagesFor(key) {

  if (kind === 'p') return (state.posts.find(x => x.id === a) || {}).images || [];
  if (kind === 's') { const c = ((state.subs[a] || {}).sol || []).find(x => x.id === b); return (c && c.images) || []; }
  return [];
}
function openViewer(images, start) {
  if (!images || !images.length) return;
  let i = Math.min(Math.max(start || 0, 0), images.length - 1);
  const many = images.length > 1, box = document.createElement('div');
  box.className = 'fixed inset-0 z-[90] flex items-center justify-center';
  box.style.background = 'rgba(0,0,0,.94)'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  const nav = (id, side, ch, label) => `<button id="${id}" type="button" aria-label="${label}" class="absolute ${side} top-1/2 -translate-y-1/2 w-11 h-11 rounded-full text-3xl leading-none text-white flex items-center justify-center" style="background:rgba(255,255,255,.18)">${ch}</button>`;
  box.innerHTML = `<img id="vwImg" alt="" draggable="false" class="max-w-full max-h-full select-none" style="touch-action:pan-y">
    <div id="vwCount" class="absolute left-4 text-white text-sm font-bold px-3 py-1 rounded-full" style="top:calc(1rem + env(safe-area-inset-top,0px));background:rgba(255,255,255,.18)"></div>
    <button id="vwClose" type="button" aria-label="Đóng" class="absolute right-3 text-white text-2xl" style="top:calc(.5rem + env(safe-area-inset-top,0px))">✕</button>
    ${many ? nav('vwPrev', 'left-2', '‹', 'Ảnh trước') + nav('vwNext', 'right-2', '›', 'Ảnh sau') : ''}`;
  const img = box.querySelector('#vwImg'), count = box.querySelector('#vwCount');
  const show = () => { const src = images[i]; img.src = String(src).startsWith('data:image/') ? src : ''; count.textContent = (i + 1) + '/' + images.length; };
  const go = d => { i = (i + d + images.length) % images.length; show(); };
  const close = () => { document.removeEventListener('keydown', onKey); box.remove(); };
  const onKey = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft' && many) go(-1); else if (e.key === 'ArrowRight' && many) go(1); };
  let sx = 0, sy = 0;
  box.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (many && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1); }, { passive: true });
  box.onclick = e => { if (e.target.closest('#vwClose') || e.target === box) close(); else if (e.target.closest('#vwPrev')) go(-1); else if (e.target.closest('#vwNext')) go(1); };
  document.addEventListener('keydown', onKey);
  show(); document.body.appendChild(box);
}

function renderPanel(key) {
  const box = document.querySelector('[data-panel="' + key + '"]'); if (!box) return;
  const [pid, kind] = key.split(':'), isSol = kind === 'sol', sub = state.subs[pid] || {}, list = sub[kind], staff = isStaff();
  let wrap = box.firstElementChild;
  if (!wrap) {
    box.innerHTML = '<div class="rounded-2xl p-3 mt-2 space-y-2" style="background:var(--soft);border:1px solid var(--line)"><p data-head class="text-sm font-bold"></p><div data-list class="space-y-2"></div><div data-form></div></div>';
    wrap = box.firstElementChild; buildComposer(wrap.querySelector('[data-form]'), key);   // ô nhập chỉ dựng 1 lần nên không mất chữ đang gõ
  }
  wrap.querySelector('[data-head]').textContent = (isSol ? 'Lời giải' : 'Bình luận') + (list ? ' (' + list.length + ')' : '');
  const el = wrap.querySelector('[data-list]');
  if (sub.err && !list) { el.innerHTML = '<div class="warn rounded-xl p-3 text-xs">' + esc(sub.err) + ' Nếu bạn vừa cập nhật bản này, hãy dán Rules mới (có phần comments / solutions) trong Firebase.</div>'; return; }
  if (!list) { el.innerHTML = '<p class="text-xs muted">Đang tải…</p>'; return; }
  if (!list.length) { el.innerHTML = '<p class="text-xs muted">' + (isSol ? 'Chưa có lời giải nào. Bạn có cách giải? Hãy đăng giúp mọi người nhé!' : 'Chưa có bình luận nào. Hãy là người đầu tiên!') + '</p>'; return; }
  el.innerHTML = list.map(c => `<div class="rounded-xl p-3" style="background:var(--surface);border:1px solid var(--line)">
    <div class="flex items-start justify-between gap-2"><p class="text-xs min-w-0"><span class="font-semibold">${esc(c.author)}</span> ${roleTag(c.authorRole)} <span class="muted">· ${ago(c.ts)}</span></p>
      ${(c.authorId === state.me || staff) ? `<button type="button" data-subdel="${esc(key)}|${esc(c.id)}" class="no-min relative text-xs font-semibold px-2 py-1 rounded-lg shrink-0" style="color:var(--berry)">Xóa</button>` : ''}</div>
    ${c.text ? `<p class="text-sm mt-1 whitespace-pre-line">${esc(c.text)}</p>` : ''}${isSol ? gallery(c.images, 's|' + pid + '|' + c.id) : ''}</div>`).join('');
}
function buildComposer(formEl, key) {
  const [pid, kind] = key.split(':'), isSol = kind === 'sol';
  formEl.innerHTML = `<div class="space-y-2">
    <textarea data-in rows="${isSol ? 3 : 2}" maxlength="${isSol ? 3000 : 500}" class="field w-full rounded-xl px-3 py-2.5 text-sm" placeholder="${isSol ? 'Nhập cách giải của bạn (có thể kèm ảnh)…' : 'Viết bình luận, hỏi bài hoặc góp ý về đề…'}"></textarea>
    ${isSol ? '<div data-prev class="grid grid-cols-3 gap-2"></div><input data-file type="file" accept="image/*" multiple class="sr-only"><button type="button" data-pick class="btn-outline w-full rounded-xl py-2 text-sm font-semibold">Thêm ảnh lời giải</button>' : ''}
    <p data-err class="text-xs hidden" style="color:var(--berry)"></p>
    <button type="button" data-send class="btn-pine w-full rounded-xl py-2.5 text-sm font-bold">${isSol ? 'Đăng lời giải' : 'Gửi bình luận'}</button></div>`;
  const ta = formEl.querySelector('[data-in]'), err = formEl.querySelector('[data-err]'), send = formEl.querySelector('[data-send]');
  ta.value = state.draft[key] || ''; ta.oninput = () => { state.draft[key] = ta.value; };
  const imgs = () => state.draftImgs[key] || (state.draftImgs[key] = []);
  let draw = () => {};
  if (isSol) {
    const prev = formEl.querySelector('[data-prev]'), file = formEl.querySelector('[data-file]'), pick = formEl.querySelector('[data-pick]');
    draw = () => {
      prev.innerHTML = imgs().map((src, i) => `<div class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1;border:1px solid var(--line)"><img src="${src}" alt="" class="w-full h-full object-cover"><button type="button" data-rm="${i}" class="no-min btn-danger absolute top-1 right-1 w-7 h-7 rounded-full text-xs font-bold" aria-label="Xóa ảnh">✕</button></div>`).join('');
      pick.disabled = imgs().length >= 3; pick.style.opacity = pick.disabled ? '.5' : '1';
    };
    pick.onclick = () => file.click();
    file.onchange = async () => {
      for (const f of [...file.files].filter(f => f.type.startsWith('image/'))) {
        if (imgs().length >= 3) { toast('Tối đa 3 ảnh cho mỗi lời giải.'); break; }
        try { imgs().push(await compressImg(f)); } catch (er) { toast('Không đọc được ảnh.'); }
      }
      file.value = ''; draw();
    };
    prev.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { imgs().splice(+b.dataset.rm, 1); draw(); } };
    draw();
  }
  send.onclick = async () => {
    const text = ta.value.trim(), images = isSol ? imgs().slice() : [], fail = m => { err.textContent = m; err.classList.remove('hidden'); };
    if (!text && !images.length) { fail(isSol ? 'Nhập nội dung hoặc thêm ảnh lời giải.' : 'Nhập nội dung bình luận.'); return; }
    if (images.reduce((n, x) => n + x.length, 0) > 800000) { fail('Ảnh quá nặng, hãy bỏ bớt ảnh.'); return; }
    err.classList.add('hidden'); send.disabled = true; const label = send.textContent; send.textContent = 'Đang gửi…';
    try {
      const data = { text, authorId:state.me, author:state.profile.name, authorRole:state.profile.role, createdAt:serverTimestamp() };
      if (isSol) data.images = images;
      await addDoc(collection(db, 'posts', pid, isSol ? 'solutions' : 'comments'), data);
      ta.value = ''; state.draft[key] = ''; if (isSol) { state.draftImgs[key] = []; draw(); }
      toast(isSol ? 'Đã đăng lời giải.' : 'Đã gửi bình luận.');
    } catch (e) { console.error(e); fail('Không gửi được: ' + dbErrorText(e)); }
    finally { send.disabled = false; send.textContent = label; }
  };
}

/* ===== Feedback ===== */
function renderFeedback() {
  const view = document.getElementById('view'); if (!view) return;
  const types = [['gop-y', 'Góp ý'], ['bao-loi', 'Báo lỗi'], ['de-xuat', 'Đề xuất tính năng']];
  view.innerHTML = `<section class="px-4 pt-4 space-y-4">
    <h2 class="text-xl font-extrabold">Góp ý / Feedback</h2>
    <p class="text-sm muted">Gửi góp ý, báo lỗi hoặc đề xuất tính năng cho Admin. Admin xem lại thủ công theo thời gian rảnh, không trực 24/7 nên có thể phản hồi chậm.</p>
    <div class="surface rounded-2xl p-4 space-y-3">
      <div class="flex flex-wrap gap-2" role="group" aria-label="Loại phản hồi">${types.map(([k, l]) => `<button type="button" data-ft="${k}" class="chip whitespace-nowrap rounded-full px-3.5 py-1.5 text-sm font-semibold" aria-pressed="${state.fbType === k}">${l}</button>`).join('')}</div>
      <textarea id="fbText" rows="5" maxlength="1000" class="field w-full rounded-xl px-4 py-3 text-sm" placeholder="Mô tả góp ý hoặc lỗi bạn gặp (nếu báo lỗi, nêu rõ thiết bị và các bước thực hiện)…">${esc(state.draft.fb || '')}</textarea>
      <p id="fbErr" class="text-sm hidden" style="color:var(--berry)"></p>
      <button id="fbSend" type="button" class="btn-pine w-full rounded-xl py-3 font-bold">Gửi phản hồi</button>
    </div></section>`;
  const ta = document.getElementById('fbText'), err = document.getElementById('fbErr'), btn = document.getElementById('fbSend');
  ta.oninput = () => { state.draft.fb = ta.value; };
  view.querySelectorAll('[data-ft]').forEach(b => b.onclick = () => { state.fbType = b.dataset.ft; view.querySelectorAll('[data-ft]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.ft === state.fbType))); });
  btn.onclick = async () => {
    const text = ta.value.trim();
    if (!text) { err.textContent = 'Hãy nhập nội dung phản hồi.'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'Đang gửi…';
    try {
      await addDoc(collection(db, 'feedback'), { type:state.fbType, text, authorId:state.me, author:state.profile.name, email:state.profile.email || '', createdAt:serverTimestamp() });
      ta.value = ''; state.draft.fb = ''; toast('Đã gửi phản hồi. Cảm ơn bạn!');
    } catch (e) { console.error(e); err.textContent = 'Không gửi được: ' + dbErrorText(e); err.classList.remove('hidden'); }
    finally { btn.disabled = false; btn.textContent = 'Gửi phản hồi'; }
  };
}
function adminFeedback() {
  if (!state.feedback.length) return '<div class="surface rounded-2xl p-6 text-center"><p class="font-semibold">Chưa có phản hồi nào</p></div>';

  return state.feedback.map(f => { const t = tl[f.type] || ['Khác', 'badge-wait']; return `<article class="surface rounded-2xl p-4">

    ${a && stat[a.status] ? `<div class="surface rounded-2xl p-4"><span class="${stat[a.status][1]} text-xs font-semibold px-2.5 py-1 rounded-full">${stat[a.status][0]}</span><p class="text-xs muted mt-2">Gửi ${ago(a.ts)}. ${a.status === 'pending' ? 'Bạn có thể chỉnh sửa và gửi lại bên dưới.' : 'Bạn có thể cập nhật hồ sơ và gửi lại.'}</p></div>` : ''}
    <div class="surface rounded-2xl p-4 space-y-4">

function renderAdmin() {
  const root = isAdmin();
  if ((!state.ready.posts || !state.ready.users) && !state.dbError) { document.getElementById('view').innerHTML = '<p class="pt-16 text-center muted">Đang tải dữ liệu quản trị…</p>'; return; }
  if (!root && state.adminTab !== 'queue') state.adminTab = 'queue';
  const pending = state.posts.filter(p => p.status === 'pending').sort((a,b) => b.ts - a.ts);
  const pendingApps = state.apps.filter(a => a.status === 'pending').length;
  const tabBtn = (k, l, n) => `<button data-at="${k}" class="chip rounded-full px-4 py-1.5 text-sm font-semibold" aria-pressed="${state.adminTab === k}">${l} (${n})</button>`;

function adminApps() {

      ? `<button data-act="app-revoke" data-id="${esc(a.id)}" class="btn-danger rounded-lg px-4 py-2 text-sm font-semibold">Thu hồi quyền</button>`

/* ===== 3.1c: bot chấm đề ảnh theo đáp án người đăng nhập ===== */
function parseOwnKey(text, subject) {
  try {
    const out = [], raw = String(text || '').replace(/\r/g, '');
    if (!raw.trim()) return out;
    const subj = subject || 'toan', parts = { I:'', II:'', III:'' };
    let cur = null;
    raw.split('\n').forEach(line => {
      const m = line.match(/^\s*(?:ph[aầ]n\s+)?(III|II|I)\s*[:.\-]\s*(.*)$/i);
      if (m) { cur = m[1].toUpperCase(); parts[cur] += ' ' + m[2]; } else parts[cur || 'I'] += ' ' + line;
    });
    let letters = [];
    const pairs = [...parts.I.matchAll(/(\d+)\s*[:.\-)]?\s*([A-Da-d])(?![A-Za-zÀ-ỹ])/g)];
    if (pairs.length) letters = pairs.map(m => [+m[1], m[2].toUpperCase()]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    else letters = parts.I.replace(/[^A-Da-d]/g, '').toUpperCase().split('').filter(Boolean);
    letters.forEach(l => out.push({ t:'mcq', q:'Xem ảnh đề và chọn đáp án đúng.', o:['A', 'B', 'C', 'D'], a:'ABCD'.indexOf(l), subject:subj }));
    parts.II.split(/[\s,;|]+/).filter(Boolean).forEach(tok => {
      const ch = tok.replace(/[^ĐđDdSs]/g, '');
      if (ch.length === 4) out.push({ t:'tf', q:'Xem ảnh đề và chọn Đúng / Sai cho từng ý.', s:ch.split('').map((c, i) => ({ x:'Ý ' + 'abcd'[i] + ' (theo ảnh đề)', v:/[ĐđDd]/.test(c) })), subject:subj });
    });
    parts.III.split(/[\s;|]+/).filter(Boolean).forEach(tok => {
      const m = tok.match(/^\d+\s*[:=]\s*(.+)$/), a = m ? m[1] : tok;
      if (a) out.push({ t:'sa', q:'Xem ảnh đề và nhập đáp án.', a:String(a), subject:subj });
    });
    return out.slice(0, 60);
  } catch (e) { console.warn('parseOwnKey', e); return []; }
}
function ownKeyCount(sp) {
  try { return sp ? parseOwnKey(sp.ownKey, sp.subject).length : 0; } catch (e) { return 0; }
}

/* ===== 3.1f: tự xóa vết bút mực / bút chì khỏi ảnh đề khi vào trận ===== */
const CLEAN_CACHE = new Map();

    const k = by * bw + bx;
    if (sc) {
      bg[k * 3] = sr / sc; bg[k * 3 + 1] = sg / sc; bg[k * 3 + 2] = sb / sc;
      if ((bg[k * 3] * 299 + bg[k * 3 + 1] * 587 + bg[k * 3 + 2] * 114) / 1000 >= 110) { good[k] = 1; gs[0] += bg[k * 3]; gs[1] += bg[k * 3 + 1]; gs[2] += bg[k * 3 + 2]; gc++; }
    }
  }

  for (let k = 0; k < n; k++) if (!good[k]) { bg[k * 3] = gl[0]; bg[k * 3 + 1] = gl[1]; bg[k * 3 + 2] = gl[2]; }

    if (!mk[p] && sat(p * 4) > 30 && ((x > 0 && mk[p - 1]) || (x < w - 1 && mk[p + 1]) || (y > 0 && mk[p - w]) || (y < h - 1 && mk[p + w]))) mk2[p] = 1;
  }

  }
}
async function prepAndRun(fn) {   // xóa vết bút khỏi ảnh đề (nếu có) rồi mới tạo trận / phòng
  const pk = GX.pk, sp = pk && pk.setup;
  if (pk && pk.cleaning) return;
  try {
    if (pk) pk.cleaning = true;
    const mode = sp ? (sp.ownClean || 'strong') : 'off';
    if (sp && sp.source === 'own' && mode !== 'off' && sp.pledge) {
      const cc = ownCandidates().find(x => x.id === sp.ownId);
      const all = [...((cc && cc.imgs) || []), ...(Array.isArray(sp.ownImgs) ? sp.ownImgs : [])];
      if (all.length) { toast('Đang xóa vết bút khỏi ảnh đề…'); await prepareClean(all, mode); }
    }
  } catch (e) { console.warn('prepAndRun', e); }
  finally { if (pk) pk.cleaning = false; }
  try { if (typeof fn === 'function') fn(); } catch (e) { console.error(e); toast('Có lỗi khi bắt đầu trận.'); }
}
function ownCleanChips(sp) {
  try {
    const cur = (sp && sp.ownClean) || 'strong';
    const chip = (k, l, sub) => `<button type="button" data-ownclean="${k}" class="pk-opt" aria-pressed="${cur === k}"><span>${l}</span><small>${sub}</small></button>`;
    return `<div class="mt-3"><p class="text-sm font-semibold">Xóa vết bút khỏi ảnh đề</p>
      <div class="grid grid-cols-3 gap-2 mt-2">${chip('off', 'Giữ nguyên', 'ảnh gốc')}${chip('ink', 'Bút mực', 'xanh / đỏ / tím')}${chip('strong', 'Mực + chì', 'mạnh nhất')}</div>
      <p class="text-xs muted mt-1">Tự động làm sạch khi vào trận. Nét chì đậm hoặc đè lên chữ có thể chưa xóa hết; chữ nhỏ và mờ có thể bị nhạt khi chọn "Mực + chì".</p></div>`;
  } catch (e) { return ''; }
}

/* ===== 3.2a: tiến độ theo ý, nhảy nhanh theo phần, thống kê kết quả ===== */
function pkItems(r) {   // tổng số ý cần làm / đã làm (Đúng-Sai tính 4 ý)
  let done = 0, total = 0;
  try {
    const qs = r && Array.isArray(r.qs) ? r.qs : [], ans = r && Array.isArray(r.ans) ? r.ans : [];
    qs.forEach((q, i) => {
      if (!q) return;
      const a = ans[i];
      if (q.t === 'tf') { total += 4; if (Array.isArray(a)) done += a.filter(x => x === true || x === false).length; }
      else { total += 1; if (isAnswered(q, a)) done += 1; }
    });
    if (r && r.hasEssay) { total += 1; if (r.essay && Array.isArray(r.essay.imgs) && r.essay.imgs.length > 0) done += 1; }
  } catch (e) { console.warn('pkItems', e); }
  return { done, total };
}
function pkCompletion(r) {
  try { const t = pkItems(r); return t.total > 0 ? Math.max(0, Math.min(100, Math.round(t.done / t.total * 100))) : 0; } catch (e) { return 0; }
}
function pkJumpBar(r) {
  try {
    if (!r || !Array.isArray(r.qs)) return '';
    const cur = r.qs[r.idx], onEssay = r.hasEssay && r.idx === r.qs.length, info = {};
    r.qs.forEach((q, i) => {
      if (!q) return;
      const k = partOf(q), o = info[k] || (info[k] = { first:i, n:0, done:0 });
      o.n++; if (isAnswered(q, r.ans[i])) o.done++;
    });
    const chip = (attrs, label, on) => `<button type="button" ${attrs} class="chip chip-sm whitespace-nowrap rounded-full px-3 text-xs font-semibold" aria-pressed="${on ? 'true' : 'false'}">${label}</button>`;
    let html = ['I', 'II', 'III'].filter(k => info[k]).map(k => chip('data-jumppart="' + info[k].first + '"', 'Phần ' + k + ' · ' + info[k].done + '/' + info[k].n, !onEssay && cur && partOf(cur) === k)).join('');
    if (r.hasEssay) html += chip('data-jumppart="' + r.qs.length + '"', 'Tự luận', onEssay);
    if (r.qs.length) html += chip('data-jumpnext', 'Câu chưa làm', false);
    return html ? `<div class="hscroll flex gap-1.5 overflow-x-auto mt-3" style="scrollbar-width:none" role="group" aria-label="Chuyển nhanh theo phần">${html}</div>` : '';
  } catch (e) { console.warn('pkJumpBar', e); return ''; }
}
function bindPkJump(view, r, redo) {
  try {
    if (!view || !r || typeof redo !== 'function') return;
    view.querySelectorAll('[data-jumppart]').forEach(b => b.onclick = () => { const i = +b.dataset.jumppart; if (Number.isFinite(i)) { r.idx = i; redo(); window.scrollTo(0, 0); } });
    const nx = view.querySelector('[data-jumpnext]');
    if (nx) nx.onclick = () => {
      const n = r.qs.length; if (!n) return;
      for (let step = 1; step <= n; step++) {
        const i = (Math.min(r.idx, n - 1) + step) % n;
        if (!isAnswered(r.qs[i], r.ans[i])) { r.idx = i; redo(); window.scrollTo(0, 0); return; }
      }
      toast('Bạn đã trả lời hết các câu.');
    };
  } catch (e) { console.warn('bindPkJump', e); }
}
function partBreakdown(r) {
  try {
    if (!r || !Array.isArray(r.qs)) return '';
    const parts = { I:{ n:0, pts:0 }, II:{ n:0, pts:0 }, III:{ n:0, pts:0 } };
    r.qs.forEach((q, i) => { if (!q) return; const k = partOf(q); parts[k].n++; parts[k].pts += scoreQ(q, Array.isArray(r.ans) ? r.ans[i] : undefined); });
    const row = (l, v, sub) => `<div class="flex items-center justify-between gap-3 px-4 py-2.5" style="border-top:1px solid var(--line)"><span class="text-sm">${l}</span><span class="text-sm font-semibold">${v}${sub ? ' <span class="muted font-normal">· ' + sub + '</span>' : ''}</span></div>`;
    let rows = ['I', 'II', 'III'].filter(k => parts[k].n > 0).map(k => row(esc(PART_NAME[k]), fmtPts(parts[k].pts) + '/' + parts[k].n, pctOf(parts[k].pts, parts[k].n) + '%')).join('');
    if (r.hasEssay) {
      const picks = r.essay && r.essay.picks ? Object.keys(r.essay.picks).filter(k => r.essay.picks[k]).length : 0, mx = r.essayMax || 0;
      rows += row('Phần tự luận', r.forfeit ? 'Bị xử thua' : fmtPts(Math.min(mx, picks)) + '/' + mx, r.forfeit ? '' : pctOf(Math.min(mx, picks), mx) + '%');
    }
    const t = pkItems(r);
    rows += row('Mức hoàn thành', t.done + '/' + t.total + ' ý', pkCompletion(r) + '%');
    return `<div class="surface rounded-2xl overflow-hidden"><p class="px-4 py-3 text-sm font-bold">Thống kê theo phần</p>${r.qs.some(q => q && q.nokey) ? '<p class="px-4 pb-2 text-xs muted">Đề chưa có đáp án: điểm tính theo mức độ làm bài (tối đa khoảng 70%).</p>' : ''}${rows}</div>`;
  } catch (e) { console.warn('partBreakdown', e); return ''; }
}

/* ===== 3.2b: chấm theo mức làm bài, thưởng xu thắng trận, giao diện ===== */
const BOT_WIN_COINS = 10, BOT_WIN_CAP = 5, NOKEY_FACTOR = 0.7;
function effortScore(q, a) {   // đề chưa có đáp án: điểm theo mức độ làm bài (tối đa NOKEY_FACTOR)
  try {
    if (!q) return 0;
    let f = 0;
    if (q.t === 'tf') f = Array.isArray(a) ? a.filter(x => x === true || x === false).length / 4 : 0;
    else f = isAnswered(q, a) ? 1 : 0;
    return Math.round(f * NOKEY_FACTOR * 100) / 100;
  } catch (e) { return 0; }
}
function sheetDefaults(subject) { return subject === 'anh' ? { i:40, ii:0, iii:0 } : subject === 'van' ? { i:10, ii:0, iii:0 } : { i:12, ii:4, iii:6 }; }
function buildSheet(sp) {   // phiếu trả lời trống cho đề ảnh chưa có đáp án
  try {
    const sh = Object.assign({}, sheetDefaults(sp && sp.subject), (sp && sp.sheet) || {}), cl = n => Math.max(0, Math.min(60, Math.floor(+n || 0)));
    const subj = (sp && sp.subject) || 'toan', out = [];
    for (let k = 0; k < cl(sh.i); k++) out.push({ t:'mcq', q:'Xem ảnh đề và chọn đáp án.', o:['A', 'B', 'C', 'D'], a:-1, subject:subj, nokey:true });
    for (let k = 0; k < cl(sh.ii); k++) out.push({ t:'tf', q:'Xem ảnh đề và chọn Đúng / Sai cho từng ý.', s:[0, 1, 2, 3].map(j => ({ x:'Ý ' + 'abcd'[j] + ' (theo ảnh đề)', v:false })), subject:subj, nokey:true });
    for (let k = 0; k < cl(sh.iii); k++) out.push({ t:'sa', q:'Xem ảnh đề và nhập đáp án.', a:'', subject:subj, nokey:true });
    return out.slice(0, 80);
  } catch (e) { console.warn('buildSheet', e); return []; }
}
function ownSheetBox(sp) {
  try {
    const d = Object.assign({}, sheetDefaults(sp && sp.subject), (sp && sp.sheet) || {});
    const inp = (id, l, v) => `<label class="block text-center"><span class="text-xs muted">${l}</span><input id="${id}" type="number" inputmode="numeric" min="0" max="60" value="${esc(v)}" class="field w-full rounded-xl px-2 py-2.5 mt-1 text-center font-bold"></label>`;
    return `<div class="mt-3 pt-3" style="border-top:1px solid var(--line)"><p class="text-sm font-semibold">Phiếu trả lời khi chưa có đáp án</p><p class="text-xs muted mt-1">Không cần nhập sẵn đáp án. Bot chấm theo mức độ làm bài (khoảng 70% điểm tối đa nếu làm hết).</p><div class="grid grid-cols-3 gap-2 mt-2">${inp('pkShI', 'Số câu Phần I', d.i)}${inp('pkShII', 'Số câu Phần II', d.ii)}${inp('pkShIII', 'Số câu Phần III', d.iii)}</div></div>`;
  } catch (e) { return ''; }
}
function botWinsLeft() {
  try { const w = W(), used = w.botWinDate === todayKey() ? (+w.botWinCount || 0) : 0; return Math.max(0, BOT_WIN_CAP - used); } catch (e) { return 0; }
}
function awardWin(r, out) {   // chỉ chạy một lần mỗi trận (cờ rewarded, được gọi trong finalizeStats đã có cờ recorded)
  if (!r || r.rewarded) return;
  r.rewarded = true;
  r.reward = { coins:0, kind:r.opp === 'human' ? 'human' : 'bot', capped:false };
  if (out !== 'win' || r.forfeit) return;
  const w = W(), t = todayKey();
  w.coins = Math.max(0, +w.coins || 0);
  if (r.opp === 'human') { const c = Math.floor(Math.random() * 51) + 50; w.coins += c; r.reward.coins = c; }
  else {
    if (w.botWinDate !== t) { w.botWinDate = t; w.botWinCount = 0; }
    if ((+w.botWinCount || 0) >= BOT_WIN_CAP) r.reward.capped = true;
    else { w.botWinCount = (+w.botWinCount || 0) + 1; w.coins += BOT_WIN_COINS; r.reward.coins = BOT_WIN_COINS; }
  }
  saveWallet();   // localStorage + đồng bộ Firestore wallets/{uid}
}
function rewardCard(r) {
  try {
    if (!r || !r.reward) return '';
    const rw = r.reward, w = W();
    if (rw.coins > 0) return `<div class="res-reward"><p class="res-reward-title">+${rw.coins} xu thưởng</p><p class="text-sm mt-1">${rw.kind === 'human' ? 'Thắng người chơi: thưởng ngẫu nhiên 50–100 xu.' : 'Thắng bot: +' + BOT_WIN_COINS + ' xu · hôm nay còn ' + botWinsLeft() + '/' + BOT_WIN_CAP + ' lượt thưởng.'}</p><p class="text-xs muted mt-1">Số dư hiện tại: ${w.coins} xu</p></div>`;
    if (rw.capped) return `<div class="res-reward res-reward-off"><p class="font-bold">Đã hết lượt thưởng xu bot hôm nay</p><p class="text-sm muted mt-1">Bạn vẫn đấu bot bình thường. Lượt thưởng được làm mới vào ngày mai.</p></div>`;
    return '';
  } catch (e) { console.warn('rewardCard', e); return ''; }
}
function botQuotaRow() {
  try { return `<div class="flex items-center justify-between gap-3 px-4 py-3" style="border-top:1px solid var(--line)"><span class="text-sm">Lượt thưởng xu bot hôm nay</span><span class="text-sm font-semibold">${botWinsLeft()}/${BOT_WIN_CAP}</span></div>`; } catch (e) { return ''; }
}
function initUiEnhance() {   // nút đang xử lý (chữ kết thúc bằng …) tự hiện vòng xoay
  try {
    const app = document.getElementById('app'); if (!app || typeof MutationObserver === 'undefined') return;
    new MutationObserver(list => list.forEach(m => {
      const b = m.target; if (!b || b.tagName !== 'BUTTON') return;
      if (b.disabled && /…\s*$/.test(b.textContent || '')) b.setAttribute('data-loading', '1'); else b.removeAttribute('data-loading');
    })).observe(app, { subtree:true, attributes:true, attributeFilter:['disabled'] });
  } catch (e) { console.warn('initUiEnhance', e); }
}
initUiEnhance();

/* ===== 8. Khởi động ===== */
const renderLoading = () => { document.getElementById('app').innerHTML = '<p class="pt-32 text-center muted">Đang tải…</p>'; };
function render() {
  if (!state.profile) { renderLogin(state.loginError); return; }
  renderShell(); renderView();
}
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { setDrawer(false); closeNotices(); } });   // kích hoạt hiệu ứng :active trên iOS
document.addEventListener('change', e => { if (e.target.id === 'inDays') { state.inactiveDays = +e.target.value; state.scanned = false; if (isAdmin()) renderAdmin(); } });
document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { const k = z.dataset.zoom, c = k.lastIndexOf(':'); openViewer(imagesFor(k.slice(0, c)), +k.slice(c + 1)); return; }
  const lk = e.target.closest('[data-like]');
  if (lk) {   // mỗi người 1 like / bài: mảng uid trong bài, bấm lại là bỏ like
    const p = state.posts.find(x => x.id === lk.dataset.like); if (!p || p.status !== 'approved' || !state.me) return;
    const liked = (p.likes || []).includes(state.me); lk.disabled = true;
    updateDoc(doc(db, 'posts', p.id), { likes: liked ? arrayRemove(state.me) : arrayUnion(state.me) })
      .catch(err => { console.error(err); toast('Không thể like: ' + (err.code || err.message)); }).finally(() => { lk.disabled = false; });
    return;
  }
  const tg = e.target.closest('[data-toggle]'); if (tg) { toggleSection(tg.dataset.toggle); return; }
  const sd = e.target.closest('[data-subdel]');
  if (sd) {
    const [key, cid] = sd.dataset.subdel.split('|'), [pid, kind] = key.split(':');
    if (!(await askConfirm(kind === 'sol' ? 'Xóa lời giải này?' : 'Xóa bình luận này?', 'Xóa'))) return;
    try { await deleteDoc(doc(db, 'posts', pid, kind === 'sol' ? 'solutions' : 'comments', cid)); toast('Đã xóa.'); } catch (err) { toast('Không xóa được: ' + (err.code || err.message)); }
    return;
  }
  const dm = e.target.closest('[data-delmine]');
  if (dm) {   // tác giả tự xóa bài của mình (đăng nhầm dạng đề thì xóa đi đăng lại)
    const p = state.posts.find(x => x.id === dm.dataset.delmine); if (!p || p.authorId !== state.me) return;
    if (!(await askConfirm('Xóa bài "' + p.title + '"? Bài cùng lời giải và bình luận kèm theo sẽ mất. Nếu chỉ chọn nhầm dạng đề, bạn có thể đăng lại đúng dạng.', 'Xóa bài'))) return;
    dm.disabled = true;
    try { await deletePostCascade(p.id); toast('Đã xóa bài của bạn. Bạn có thể đăng lại đúng dạng đề.'); } catch (err) { console.error(err); toast('Không xóa được: ' + (err.code || err.message)); dm.disabled = false; }
  }
});
document.addEventListener('visibilitychange', () => {   // ghi nhận số lần rời tab khi đang làm bài PK
  try {
    const r = GX.pk.run; if (!r || r.isFinished) return;
    if (document.hidden) { if (!GX.pk.picking) r.leaves = (r.leaves || 0) + 1; }
    else { pkTick(); if (state.view === 'pk' && GX.pk.step === 'play') renderPk(); }
  } catch (e) { console.warn('visibility', e); }
});
document.addEventListener('focusout', () => {   // gõ xong thì mới cập nhật bảng tin đang chờ
  if (!state.pendingRender) return;
  setTimeout(() => { const ae = document.activeElement; if (!ae || !/^(TEXTAREA|INPUT)$/.test(ae.tagName)) softRender(); }, 200);
});
renderLoading();
if (!FIREBASE_READY) {
  document.getElementById('app').innerHTML = '<main class="px-6 pt-20"><div class="surface rounded-2xl p-6"><h1 class="text-xl font-extrabold">Chưa có cấu hình Firebase</h1><p class="muted text-sm mt-2">Hãy điền <b>firebaseConfig</b> ở đầu file rồi tải lại trang.</p></div></main>';
} else {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp); db = getFirestore(fbApp);
  setPersistence(auth, browserLocalPersistence).catch(() => {});   // giữ đăng nhập khi tải lại trang / mở lại PWA
  getRedirectResult(auth).catch(err => { state.loginError = authErrorText(err); if (!state.profile) renderLogin(state.loginError); });
  onAuthStateChanged(auth, fb => {
    if (fb) onGoogleUser(fb);
    else { stopListeners(); pkReset(); GX.wallet = null; state.me = null; state.profile = null; const m = state.loginError; state.loginError = ''; renderLogin(m); }
  });
}
</script>
