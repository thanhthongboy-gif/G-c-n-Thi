<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Góc Ôn Thi – Cộng đồng chia sẻ đề</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { borderRadius: { xl:'10px', '2xl':'12px', '3xl':'14px' }, fontFamily: { sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
  :root {
    color-scheme: light;
    /* Tone Trắng + Xanh dương. (Tên biến --pine giữ nguyên để không vỡ code cũ, nhưng giờ là màu xanh chủ đạo) */
    --bg:#F8FAFC; --surface:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9; --act-bg:#E0F2FE; --act-ink:#0B3A8F; --act-line:#7DB8F0;
    --pine:#2563EB; --pine-ink:#FFFFFF; --gold:#F5B72E;
    --berry:#C4283A; --berry-bg:#FEECEE; --berry-line:#F5A9B2;
    --ok-bg:#E2F5EA; --ok:#157A3E; --wait-bg:#FFF4D6; --wait:#8A5A00;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top,0px); }
  body { background:var(--bg); color:var(--ink); font-family:'Be Vietnam Pro',system-ui,sans-serif; }
  .surface { background:var(--surface); border:1px solid var(--line); box-shadow:none; }
  .muted { color:var(--muted); }
  .btn-pine { background:var(--act-bg); color:var(--act-ink); border:1.5px solid var(--act-line); }
  .btn-pine:disabled { background:var(--line); color:var(--muted); border-color:var(--line); cursor:not-allowed; }
  .btn-danger { background:var(--berry); color:var(--surface); }
  .btn-outline { border:1.5px solid var(--line); color:var(--ink); }
  .field { background:var(--bg); border:1px solid var(--line); color:var(--ink); }
  .field:focus { outline:2px solid var(--pine); outline-offset:1px; }
  .chip { border:1px solid var(--line); background:var(--surface); }
  .chip[aria-pressed="true"] { background:var(--act-bg); color:var(--act-ink); border-color:var(--pine); box-shadow:0 0 0 1px var(--pine) inset; }
  .type-card { border:1.5px solid var(--line); background:var(--surface); }
  .type-card[aria-checked="true"] { border-color:var(--pine); box-shadow:0 0 0 2px var(--pine) inset; }
  .type-card[data-sensitive="true"][aria-checked="true"] { border-color:var(--berry); box-shadow:0 0 0 2px var(--berry) inset; }
  .warn { background:var(--berry-bg); border:1px solid var(--berry-line); color:var(--berry); }
  .badge-ok { background:var(--ok-bg); color:var(--ok); }
  .badge-wait { background:var(--wait-bg); color:var(--wait); }
  .badge-bad { background:var(--berry-bg); color:var(--berry); }
  .admin-tag { background:var(--gold); color:#3A2A00; }
  .badge-photo { background:var(--act-bg); color:var(--act-ink); }
  .nav-item { min-height:48px; color:var(--ink); }
  .nav-item[aria-current="true"] { background:var(--act-bg); color:var(--act-ink); box-shadow:0 0 0 1.5px var(--act-line) inset; }
  .nav-item:active { background:var(--soft); }
  .nav-item[data-soon] { color:var(--muted); }
  .subj-toan, .subj-van, .subj-anh, .subj-tin { background:var(--soft); color:var(--ink); border:1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) { .pop { animation: pop .18s ease-out; } }
  /* ===== Cảm ứng: bỏ trễ chạm, vùng bấm ≥ 44px, phản hồi tức thì ===== */
  html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, label.chip, select, [role="radio"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; user-select: none; -webkit-user-select: none; }
  button { min-height: 44px; min-width: 44px; }
  button.no-min { min-height: 0; min-width: 0; }
  button.no-min::after { content: ''; position: absolute; inset: -10px; }
  label.chip { min-height: 44px; display: flex; align-items: center; justify-content: center; }
  button:disabled { cursor: not-allowed; }
  button, label.chip, .type-card, [data-zoom] { transition: transform .08s ease-out, opacity .08s ease-out; }
  button:not(:disabled):active, label.chip:active, .type-card:active { transform: scale(.95); opacity: .75; }
  [data-zoom]:active { transform: scale(.97); opacity: .85; }
  /* Thanh tab dưới (mobile) */
  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px); }
  .chip-sm { min-height:36px; }
  .act-btn { min-height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); }
  .act-btn[aria-pressed="true"] { background:var(--act-bg); color:var(--act-ink); }
  .hscroll::-webkit-scrollbar { display:none; }
  .tab { min-height:50px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:10.5px; font-weight:600; color:var(--muted); }
  .tab .tab-ico { position:relative; width:40px; height:24px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .tab[aria-current="true"] { color:var(--pine); font-weight:700; }
  .tab[aria-current="true"] .tab-ico { background:var(--act-bg); color:var(--act-ink); box-shadow:0 0 0 1px var(--act-line) inset; }
  @keyframes pop { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
</style>
</head>
<body class="min-h-screen">
<div id="app" class="mx-auto max-w-2xl min-h-screen relative"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-20 z-[80] hidden px-4 py-2 rounded-full text-sm font-medium shadow-lg" style="background:var(--ink);color:var(--bg)"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp, writeBatch, getDocs, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 0. FIREBASE & PHÂN QUYỀN ===== */
const firebaseConfig = {            // Firebase Console → Project settings → Your apps (Web)
  apiKey: "AIzaSyACh4k9ZAaEkvvHXBAg1_2IovJ5ATPCs-A",
  authDomain: "goconthi-57c98.firebaseapp.com",
  projectId: "goconthi-57c98",
  appId: "1:812551550808:web:54cf19cf0d676d8739172d"
};
const ADMIN_EMAILS = [              // Email Google của quản trị viên (Thành Thông). Trùng email là tự động có quyền Admin
  'thanhthongboy@gmail.com'         // (Firestore Rules cũng kiểm tra đúng email này ở phía máy chủ)
];
const FIREBASE_READY = !!(firebaseConfig.apiKey && firebaseConfig.projectId);
let auth = null, db = null;

/* ===== 1. Cấu hình ===== */
const SUBJECTS = { toan:'Toán', van:'Ngữ Văn', anh:'Tiếng Anh', tin:'Tin học' };
const TYPES = {
  practice:{ label:'Đề thi thử / Tự luyện', sensitive:false, hint:'Đăng công khai ngay' },
  semester:{ label:'Đề học kỳ', sensitive:true, hint:'Cần kiểm duyệt' },
  thptqg:{ label:'Đề THPTQG', sensitive:true, hint:'Cần kiểm duyệt' }
};
const MIN = 60000, HOUR = 3600000, DAY = 24 * HOUR;
const normEmail = e => String(e || '').trim().toLowerCase();
const isAdminEmail = e => ADMIN_EMAILS.map(normEmail).includes(normEmail(e));


/* ===== 2. Trạng thái (dữ liệu lấy real-time từ Firestore, dùng chung cho mọi thiết bị) ===== */
const state = { me:null, profile:null, view:'feed', filter:'all', adminTab:'queue', users:[], posts:[], inactiveDays:30, scanned:false, lastPurge:null, loginError:'', dbError:'', noticeErr:'', notices:[], noticeOpen:false, noticePrev:0, apps:[], myApp:null, appErr:'', appFilter:'pending', feedback:[], fbType:'gop-y', open:new Set(), subs:{}, draft:{}, draftImgs:{}, pendingRender:false, ready:{ posts:false, users:false, apps:false } };
const me = () => state.profile;
const isAdmin = () => !!state.profile && state.profile.role === 'admin';
const errBanner = () => state.dbError ? `<div class="warn rounded-xl p-3 text-sm mb-3" role="alert">${esc(state.dbError)}</div>` : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ts) {
  const d = Date.now() - ts;
  if (d < MIN) return 'Vừa xong';
  if (d < HOUR) return Math.floor(d/MIN) + ' phút trước';
  if (d < 24*HOUR) return Math.floor(d/HOUR) + ' giờ trước';
  return new Date(ts).toLocaleDateString('vi-VN');
}
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2800);
}
const adminTag = '<span class="admin-tag text-[10px] font-extrabold px-1.5 py-0.5 rounded">ADMIN</span>';
const modTag = '<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded" style="background:var(--act-bg);color:var(--act-ink);border:1px solid var(--act-line)">CTV</span>';
const roleTag = r => r === 'admin' ? adminTag : r === 'mod' ? modTag : '';
const isMod = () => !!state.profile && state.profile.role === 'mod';     // cộng tác viên: chỉ duyệt/ẩn/xóa bài
const isStaff = () => isAdmin() || isMod();                              // isAdmin() = Admin gốc (theo email) mới cấp/thu hồi quyền

/* Hộp xác nhận ngay trong trang (confirm() của trình duyệt hay bị chặn trong khung preview/iframe nên nút tưởng như đơ) */
let lastAct = 0;
function askConfirm(msg, okLabel, tone) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-4';
    wrap.style.background = 'rgba(0,0,0,.6)';
    wrap.innerHTML = `<div class="surface pop rounded-2xl p-5 w-full max-w-sm" role="alertdialog" aria-modal="true"><p class="text-sm whitespace-pre-line">${esc(msg)}</p><div class="mt-4 flex gap-2 justify-end"><button type="button" data-no class="btn-outline rounded-lg px-4 py-2 text-sm font-semibold">Hủy</button><button type="button" data-yes class="${tone === 'pine' ? 'btn-pine' : 'btn-danger'} rounded-lg px-4 py-2 text-sm font-semibold">${esc(okLabel || 'Đồng ý')}</button></div></div>`;
    const done = v => { wrap.remove(); resolve(v); };
    wrap.onclick = e => { if (e.target.closest('[data-yes]')) done(true); else if (e.target === wrap || e.target.closest('[data-no]')) done(false); };
    document.body.appendChild(wrap);
  });
}
/* Cập nhật mềm: chỉ vẽ lại phần nội dung đang xem, giữ nguyên vị trí cuộn, không dựng lại header/thanh điều hướng */
function updatePendingBadge() {
  const n = state.posts.filter(p => p.status === 'pending').length;
  const b = document.getElementById('navBadge'); if (b) { b.textContent = n; b.classList.toggle('hidden', !n); }
  const d = document.getElementById('menuDot'); if (d) d.classList.toggle('hidden', !(n && isStaff()));
}
function softRender() {
  const ae = document.activeElement;
  if (state.view === 'feed' && ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName) && ae.closest('#view')) { state.pendingRender = true; updatePendingBadge(); return; }
  state.pendingRender = false;
  const y = window.scrollY;
  updatePendingBadge();
  if (state.view === 'feed') renderFeed(); else if (state.view === 'admin') renderAdmin();
  window.scrollTo(0, y);
}

/* ===== 3. Đăng nhập: Google (Firebase Auth) + chế độ khách tùy chọn ===== */
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const GOOGLE_G = '<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
function authErrorText(err) {
  const m = {
    'auth/unauthorized-domain': 'Tên miền này chưa được thêm vào Authorized domains trong Firebase Authentication.',
    'auth/operation-not-allowed': 'Chưa bật đăng nhập Google trong Firebase Console (Authentication → Sign-in method).',
    'auth/network-request-failed': 'Mất kết nối mạng. Hãy kiểm tra Internet rồi thử lại.',
    'auth/too-many-requests': 'Thử quá nhiều lần. Hãy đợi một lát rồi thử lại.'
  };
  return m[err && err.code] || 'Không đăng nhập được: ' + ((err && (err.code || err.message)) || 'lỗi không xác định');
}
function dbErrorText(err) {
  const c = err && err.code;
  if (c === 'timeout') return 'Mạng yếu nên bài chưa lên được máy chủ. Hãy giữ nguyên trang, kiểm tra mạng rồi bấm đăng lại.';
  if (c === 'permission-denied') return 'Không có quyền đọc/ghi dữ liệu. Hãy tạo Firestore Database và dán Rules (Firebase → Firestore Database → Rules).';
  if (c === 'unavailable' || c === 'not-found' || c === 'failed-precondition') return 'Chưa kết nối được cơ sở dữ liệu. Kiểm tra mạng và đã tạo Firestore Database chưa.';
  return 'Lỗi dữ liệu: ' + ((err && (c || err.message)) || 'không xác định');
}
function renderLogin(errMsg) {
  document.getElementById('app').innerHTML = `
  <main class="min-h-screen flex flex-col justify-center px-5 py-10">
    <div class="mb-6">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center font-extrabold text-xl" style="background:var(--pine);color:#fff" aria-hidden="true">G</div>
      <h1 class="mt-4 text-2xl font-extrabold tracking-tight">Góc Ôn Thi</h1>
      <p class="mt-1 text-sm muted">Kho đề và lời giải do học sinh chia sẻ · Toán, Ngữ Văn, Tiếng Anh, Tin học</p>
    </div>
    <div class="surface rounded-2xl p-4 space-y-3">
      <p id="lgErr" role="alert" class="text-sm font-medium ${errMsg ? '' : 'hidden'}" style="color:var(--berry)">${esc(errMsg || '')}</p>
      <button id="ggBtn" type="button" class="w-full rounded-xl py-3.5 font-semibold flex items-center justify-center gap-3" style="background:#fff;color:#1f1f1f;border:1px solid #dadce0">${GOOGLE_G}<span>Đăng nhập bằng Google</span></button>
      <p class="text-xs muted">Tài khoản vi phạm quy chế thi cử sẽ bị khóa vĩnh viễn.</p>
      <p class="text-xs font-semibold" style="color:var(--wait)">Admin không hoạt động 24/7, nếu có chậm trễ duyệt bài xin nương tay.</p>
    </div>
    <p class="text-[10px] muted text-center mt-4">Phiên bản 13 · dữ liệu dùng chung</p>
  </main>`;
  document.getElementById('ggBtn').onclick = e => googleSignIn(e.currentTarget);
}
/* Popup trên trình duyệt thường; app đã thêm vào màn hình chính (PWA) hoặc popup bị chặn thì tự chuyển sang redirect */
async function googleSignIn(btn) {
  const label = btn.querySelector('span'); btn.disabled = true; label.textContent = 'Đang mở Google…';
  const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt:'select_account' });
  try {
    if (isStandalone()) { await signInWithRedirect(auth, provider); return; }
    await signInWithPopup(auth, provider);
  } catch (err) {
    let e = err;
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(err.code)) {
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
    }
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') renderLogin();
    else renderLogin(authErrorText(e));
  }
}
/* ===== Dữ liệu real-time từ Firestore ===== */
const toMs = v => (v && v.toMillis ? v.toMillis() : (typeof v === 'number' ? v : 0));
const mapDocs = snap => snap.docs.map(d => { const x = d.data({ serverTimestamps:'estimate' }); return { ...x, id:d.id, ts:toMs(x.createdAt), joined:toMs(x.joined), lastActive:toMs(x.lastActive) }; });
const bag = { approved:[], mine:[], all:[] };
let unsubs = [];
function stopListeners() {
  unsubs.forEach(u => u()); unsubs = [];
  bag.approved = []; bag.mine = []; bag.all = []; state.posts = []; state.users = []; state.notices = []; state.apps = []; state.myApp = null; state.feedback = []; closeSubs(); state.ready = { posts:false, users:false, apps:false };
}
function rebuildPosts() {   // học sinh chỉ thấy bài đã duyệt + bài của chính mình; admin thấy tất cả
  if (isStaff()) state.posts = bag.all.slice();
  else { const m = new Map(); [...bag.approved, ...bag.mine].forEach(p => m.set(p.id, p)); state.posts = [...m.values()]; }
  state.posts.sort((a, b) => b.ts - a.ts);
}
function startListeners() {
  stopListeners();
  const uid = state.me, posts = collection(db, 'posts');
  const onErr = err => { console.error(err); state.dbError = dbErrorText(err); softRender(); };
  const got = key => { state.ready[key] = true; state.dbError = ''; rebuildPosts(); softRender(); };
  unsubs.push(onSnapshot(doc(db, 'users', uid), snap => {   // bị khóa thì đăng xuất ngay; đổi vai trò (cấp/thu hồi CTV) thì áp dụng ngay
    if (!snap.exists()) return;
    const d = snap.data();
    if (d.banned) { state.loginError = 'Tài khoản này đã bị khóa vĩnh viễn do vi phạm quy chế thi cử.'; signOut(auth); return; }
    if (!isAdminEmail(state.profile.email) && ['student', 'mod'].includes(d.role) && d.role !== state.profile.role) {
      state.profile.role = d.role; startListeners(); render();
      toast(d.role === 'mod' ? 'Bạn vừa được cấp quyền cộng tác viên duyệt bài.' : 'Quyền cộng tác viên của bạn đã được thu hồi.');
    }
  }, onErr));
  unsubs.push(onSnapshot(query(collection(db, 'notices'), orderBy('createdAt', 'desc'), limit(50)), snap => {   // thông báo chung, ai cũng đọc được
    state.notices = mapDocs(snap).sort((a, b) => b.ts - a.ts); state.noticeErr = ''; onNotices();
  }, err => { console.error(err); state.noticeErr = dbErrorText(err); onNotices(); }));
  if (isStaff()) {   // Admin + CTV đọc toàn bộ bài để duyệt
    unsubs.push(onSnapshot(posts, snap => { bag.all = mapDocs(snap); got('posts'); }, onErr));
  } else {
    let a = false, m = false;
    unsubs.push(onSnapshot(query(posts, where('status', '==', 'approved')), snap => { bag.approved = mapDocs(snap); a = true; if (a && m) got('posts'); }, onErr));
    unsubs.push(onSnapshot(query(posts, where('authorId', '==', uid)), snap => { bag.mine = mapDocs(snap); m = true; if (a && m) got('posts'); }, onErr));
  }
  if (isAdmin()) {   // chỉ Admin gốc đọc danh sách tài khoản và hồ sơ làm chung
    unsubs.push(onSnapshot(collection(db, 'users'), snap => { state.users = mapDocs(snap); got('users'); }, onErr));
    unsubs.push(onSnapshot(query(collection(db, 'feedback'), orderBy('createdAt', 'desc'), limit(100)), snap => { state.feedback = mapDocs(snap); softRender(); }, err => console.error(err)));
    unsubs.push(onSnapshot(collection(db, 'applications'), snap => { state.apps = mapDocs(snap); got('apps'); }, err => { console.error(err); state.dbError = dbErrorText(err); state.ready.apps = true; softRender(); }));
  } else {
    state.ready.users = true; state.ready.apps = true;
    unsubs.push(onSnapshot(doc(db, 'applications', uid), snap => {   // hồ sơ của chính mình
      const d = snap.exists() ? snap.data({ serverTimestamps:'estimate' }) : null;
      state.myApp = d ? { ...d, id:snap.id, ts:toMs(d.createdAt) } : null; state.appErr = '';
      if (state.view === 'apply') renderApply();
    }, err => { console.error(err); state.appErr = dbErrorText(err); if (state.view === 'apply') renderApply(); }));
  }
}
/* Có người dùng Google (đăng nhập mới hoặc khôi phục phiên): đồng bộ hồ sơ, gán quyền theo email */
async function onGoogleUser(fb) {
  const email = normEmail(fb.email), ref = doc(db, 'users', fb.uid);
  try {
    const snap = await getDoc(ref);
    if (snap.exists() && snap.data().banned) {
      state.loginError = 'Tài khoản này đã bị khóa vĩnh viễn do vi phạm quy chế thi cử.';
      await signOut(auth); return;
    }
    const name = fb.displayName || email.split('@')[0] || 'Người dùng', root = isAdminEmail(email);
    const role = root ? 'admin' : (snap.exists() && snap.data().role === 'mod' ? 'mod' : 'student');   // CTV giữ nguyên quyền khi đăng nhập lại
    const info = { name, email, photo:fb.photoURL || '', lastActive:serverTimestamp() };
    if (root) info.role = 'admin';
    if (snap.exists()) await updateDoc(ref, info); else await setDoc(ref, { ...info, role, banned:false, joined:serverTimestamp() });
    const fresh = state.me !== fb.uid;
    state.me = fb.uid; state.profile = { id:fb.uid, name, email, photo:info.photo, role };
    state.view = 'feed'; if (fresh) state.dbError = '';
    startListeners(); render();
  } catch (err) {
    console.error(err); state.loginError = dbErrorText(err);
    try { await signOut(auth); } catch (e) {}
  }
}

function openViewer(images, start) {
  if (!images || !images.length) return;
  let i = Math.min(Math.max(start || 0, 0), images.length - 1);
  const many = images.length > 1, box = document.createElement('div');
  box.className = 'fixed inset-0 z-[90] flex items-center justify-center';
  box.style.background = 'rgba(0,0,0,.94)'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  const nav = (id, side, ch, label) => `<button id="${id}" type="button" aria-label="${label}" class="absolute ${side} top-1/2 -translate-y-1/2 w-11 h-11 rounded-full text-3xl leading-none text-white flex items-center justify-center" style="background:rgba(255,255,255,.18)">${ch}</button>`;
  box.innerHTML = `<img id="vwImg" alt="" draggable="false" class="max-w-full max-h-full select-none" style="touch-action:pan-y">
    <div id="vwCount" class="absolute left-4 text-white text-sm font-bold px-3 py-1 rounded-full" style="top:calc(1rem + env(safe-area-inset-top,0px));background:rgba(255,255,255,.18)"></div>
    <button id="vwClose" type="button" aria-label="Đóng" class="absolute right-3 text-white text-2xl" style="top:calc(.5rem + env(safe-area-inset-top,0px))">✕</button>
    ${many ? nav('vwPrev', 'left-2', '‹', 'Ảnh trước') + nav('vwNext', 'right-2', '›', 'Ảnh sau') : ''}`;
  const img = box.querySelector('#vwImg'), count = box.querySelector('#vwCount');
  const show = () => { const src = images[i]; img.src = String(src).startsWith('data:image/') ? src : ''; count.textContent = (i + 1) + '/' + images.length; };
  const go = d => { i = (i + d + images.length) % images.length; show(); };
  const close = () => { document.removeEventListener('keydown', onKey); box.remove(); };
  const onKey = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft' && many) go(-1); else if (e.key === 'ArrowRight' && many) go(1); };
  let sx = 0, sy = 0;
  box.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (many && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1); }, { passive: true });
  box.onclick = e => { if (e.target.closest('#vwClose') || e.target === box) close(); else if (e.target.closest('#vwPrev')) go(-1); else if (e.target.closest('#vwNext')) go(1); };
  document.addEventListener('keydown', onKey);
  show(); document.body.appendChild(box);
}

        if (imgs().length >= 3) { toast('Tối đa 3 ảnh cho mỗi lời giải.'); break; }
        try { imgs().push(await compressImg(f)); } catch (er) { toast('Không đọc được ảnh.'); }
      }
      file.value = ''; draw();
    };
    prev.onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { imgs().splice(+b.dataset.rm, 1); draw(); } };
    draw();
  }
  send.onclick = async () => {
    const text = ta.value.trim(), images = isSol ? imgs().slice() : [], fail = m => { err.textContent = m; err.classList.remove('hidden'); };
    if (!text && !images.length) { fail(isSol ? 'Nhập nội dung hoặc thêm ảnh lời giải.' : 'Nhập nội dung bình luận.'); return; }
    if (images.reduce((n, x) => n + x.length, 0) > 800000) { fail('Ảnh quá nặng, hãy bỏ bớt ảnh.'); return; }
    err.classList.add('hidden'); send.disabled = true; const label = send.textContent; send.textContent = 'Đang gửi…';
    try {
      const data = { text, authorId:state.me, author:state.profile.name, authorRole:state.profile.role, createdAt:serverTimestamp() };
      if (isSol) data.images = images;
      await addDoc(collection(db, 'posts', pid, isSol ? 'solutions' : 'comments'), data);
      ta.value = ''; state.draft[key] = ''; if (isSol) { state.draftImgs[key] = []; draw(); }
      toast(isSol ? 'Đã đăng lời giải.' : 'Đã gửi bình luận.');
    } catch (e) { console.error(e); fail('Không gửi được: ' + dbErrorText(e)); }
    finally { send.disabled = false; send.textContent = label; }
  };
}

        <ul class="text-xs muted mt-1 space-y-0.5">${list.map(u => `<li>${esc(u.name)} · hoạt động cuối ${seen(u)}</li>`).join('')}</ul>
        <button data-act="clean" class="btn-danger rounded-lg px-4 py-2 text-sm font-semibold mt-3">Xóa tài khoản không hoạt động (${list.length})</button></div>`
    : `<p class="text-sm font-semibold mt-3 pt-3" style="border-top:1px solid var(--line);color:var(--ok)">Không có tài khoản nào không hoạt động. Danh sách đang sạch.</p>`;
  return `<div class="surface rounded-2xl p-4">
    <p class="font-bold">Dọn tài khoản ngủ quên</p>
    <p class="text-xs muted mt-1">Lọc các tài khoản lâu không hoạt động. Admin, tài khoản của bạn và tài khoản đã bị khóa luôn được giữ lại. Bài đã đăng vẫn được giữ nguyên.</p>
    <div class="mt-3 flex flex-wrap items-center gap-2">
      <select id="inDays" class="field rounded-lg px-3 py-2 text-sm" aria-label="Ngưỡng không hoạt động">${opts}</select>
      <button data-act="scan" class="btn-outline rounded-lg px-4 py-2 text-sm font-semibold">Xem trước danh sách</button>
    </div>
    <button data-act="purge" class="btn-danger w-full rounded-xl py-3 mt-3 text-sm font-bold">Dọn dẹp tài khoản không hoạt động (>${state.inactiveDays} ngày không online)</button>${state.lastPurge ? `<p class="text-xs mt-2 font-semibold" style="color:var(--ok)">Lần dọn gần nhất: đã xóa ${state.lastPurge.n} tài khoản (${new Date(state.lastPurge.at).toLocaleString('vi-VN')}).</p>` : ''}${result}
  </div>`;
}
function adminUsers() {
  return cleanupPanel() + state.users.slice().sort((a,b) => b.joined - a.joined).map(u => {
    const n = state.posts.filter(p => p.authorId === u.id).length, self = u.id === state.me;
    const act = u.role === 'admin' ? '<span class="text-xs muted">Không thể khóa</span>'
      : u.banned ? `<button data-act="unban" data-id="${esc(u.id)}" class="btn-outline rounded-lg px-3 py-1.5 text-xs font-semibold">Mở khóa (Unban)</button>`
      : `<button data-act="ban" data-id="${esc(u.id)}" class="btn-danger rounded-lg px-3 py-1.5 text-xs font-semibold">Khóa vĩnh viễn (Ban)</button>`;
    return `<div class="surface rounded-2xl p-4 flex items-center justify-between gap-3">
      <div class="min-w-0"><p class="font-semibold truncate">${esc(u.name)} ${roleTag(u.role)}${self ? ' <span class="text-xs muted">(bạn)</span>' : ''}</p>${u.email ? `<p class="text-xs muted truncate">${esc(u.email)}</p>` : ''}
        <p class="text-xs muted mt-0.5">${n} bài · tham gia ${new Date(u.joined).toLocaleDateString('vi-VN')} · hoạt động cuối ${seen(u)} · <span class="${u.banned ? 'badge-bad' : 'badge-ok'} px-1.5 py-0.5 rounded-full font-semibold">${u.banned ? 'Đã khóa' : 'Hoạt động'}</span>${isInactive(u) ? ' <span class="badge-wait px-1.5 py-0.5 rounded-full font-semibold">Ngủ quên</span>' : ''}</p></div>
      <div class="flex flex-col items-end gap-2 shrink-0">${act}${u.role === 'mod' ? `<button data-act="revoke" data-id="${esc(u.id)}" class="btn-outline rounded-lg px-3 py-1.5 text-xs font-semibold">Thu hồi quyền CTV</button>` : ''}${u.role === 'admin' ? '' : `<button data-act="deluser" data-id="${esc(u.id)}" class="btn-outline rounded-lg px-3 py-1.5 text-xs font-semibold" style="color:var(--berry);border-color:var(--berry)">Xóa tài khoản</button>`}</div></div>`;
  }).join('');
}
async function setMod(uid, grant) {   // cấp / thu hồi quyền CTV theo UID (ghi cả hồ sơ và tài khoản trong một lần)
  const batch = writeBatch(db);
  batch.update(doc(db, 'users', uid), grant ? { role:'mod', roleGrantedBy:state.me, roleGrantedAt:serverTimestamp() } : { role:'student', roleRevokedBy:state.me, roleRevokedAt:serverTimestamp() });
  if (state.apps.some(a => a.id === uid)) batch.update(doc(db, 'applications', uid), { status: grant ? 'approved' : 'revoked', reviewedBy:state.me, reviewedAt:serverTimestamp() });
  await batch.commit();
}
document.getElementById('app').addEventListener('click', async e => {
  const at = e.target.closest('[data-at]');
  if (at && isStaff()) { state.adminTab = at.dataset.at; renderAdmin(); return; }
  const af = e.target.closest('[data-af]');
  if (af && isAdmin()) { state.appFilter = af.dataset.af; renderAdmin(); return; }
  const b = e.target.closest('[data-act]');
  const STAFF_ACTS = ['ok', 'del', 'hide', 'unhide'];   // CTV chỉ được 4 thao tác này; còn lại chỉ Admin gốc (Firestore Rules cũng chặn ở máy chủ)
  if (!b || !(isAdmin() || (isStaff() && STAFF_ACTS.includes(b.dataset.act)))) return;
  if (Date.now() - lastAct < 300) return;   // chống bấm đúp: danh sách dịch lên sẽ không trúng nhầm bài kế tiếp
  lastAct = Date.now();
  const id = b.dataset.id, act = b.dataset.act;
  const deleteUsers = async list => { for (let i = 0; i < list.length; i += 400) { const batch = writeBatch(db); list.slice(i, i + 400).forEach(u => batch.delete(doc(db, 'users', u.id))); await batch.commit(); } };
  b.disabled = true; b.style.opacity = '.5';
  try {
    if (act === 'ok') { await updateDoc(doc(db, 'posts', id), { status:'approved', approvedBy:state.me, approvedAt:serverTimestamp() }); toast('Đã duyệt. Bài đã lên bảng tin chung.'); }
    if (act === 'del') { { const pp = state.posts.find(x => x.id === id); if (!(await askConfirm('Xóa vĩnh viễn bài "' + (pp ? pp.title : '') + '"? Hành động này không hoàn tác được.', 'Xóa bài'))) return; } await deletePostCascade(id); toast('Đã xóa bài viết vi phạm.'); }
    if (act === 'ban') {
      const u = state.users.find(x => x.id === id);
      if (!u || u.role === 'admin' || !(await askConfirm('Khóa vĩnh viễn tài khoản "' + u.name + '"?', 'Khóa vĩnh viễn'))) return;
      await updateDoc(doc(db, 'users', id), { banned:true, bannedAt:serverTimestamp(), bannedBy:state.me }); toast('Đã khóa tài khoản.');
    }
    if (act === 'unban') { await updateDoc(doc(db, 'users', id), { banned:false }); toast('Đã mở khóa tài khoản.'); }
    if (act === 'deluser') {   // xóa ngay một tài khoản, không cần chờ "ngủ quên"
      const u = state.users.find(x => x.id === id);
      if (!u || u.role === 'admin' || id === state.me) return;
      const warn = u.banned ? '\n\nTài khoản này đang bị KHÓA. Xóa đi thì họ có thể đăng nhập lại và tạo tài khoản mới để né lệnh cấm.' : '\n\nNếu họ đăng nhập lại, tài khoản sẽ được tạo mới. Muốn chặn hẳn hãy dùng nút Khóa vĩnh viễn.';
      if (!(await askConfirm('Xóa vĩnh viễn tài khoản "' + u.name + '"? Bài họ đã đăng vẫn được giữ lại.' + warn, 'Xóa tài khoản'))) return;
      await deleteDoc(doc(db, 'users', id)); toast('Đã xóa tài khoản "' + u.name + '".');
    }
    if (act === 'hide') { await updateDoc(doc(db, 'posts', id), { status:'hidden', hiddenBy:state.me, hiddenAt:serverTimestamp() }); toast('Đã ẩn bài viết.'); }
    if (act === 'unhide') { await updateDoc(doc(db, 'posts', id), { status:'approved', approvedBy:state.me, approvedAt:serverTimestamp() }); toast('Đã hiện lại bài viết.'); }
    if (act === 'app-approve') {
      const a = state.apps.find(x => x.id === id), u = state.users.find(x => x.id === id);
      if (!a) return;
      if (!u) { toast('Người này chưa có tài khoản trong hệ thống.'); return; }
      if (u.banned) { toast('Tài khoản đang bị khóa, không thể cấp quyền.'); return; }
      if (!(await askConfirm('Cấp quyền cộng tác viên cho "' + a.name + '"? Họ sẽ có thể duyệt, ẩn và xóa bài viết (không cấp được quyền cho người khác).', 'Cấp quyền'))) return;
      await setMod(id, true); toast('Đã cấp quyền cộng tác viên cho ' + a.name + '.');
    }
    if (act === 'app-reject') {
      const a = state.apps.find(x => x.id === id); if (!a) return;
      if (!(await askConfirm('Từ chối hồ sơ của "' + a.name + '"? Họ vẫn có thể chỉnh sửa và gửi lại.', 'Từ chối'))) return;
      await updateDoc(doc(db, 'applications', id), { status:'rejected', reviewedBy:state.me, reviewedAt:serverTimestamp() }); toast('Đã từ chối hồ sơ.');
    }
    if (act === 'app-revoke' || act === 'revoke') {
      const u = state.users.find(x => x.id === id), a = state.apps.find(x => x.id === id);
      if (!(await askConfirm('Thu hồi quyền cộng tác viên của "' + ((u && u.name) || (a && a.name) || 'người này') + '"?', 'Thu hồi'))) return;
      await setMod(id, false); toast('Đã thu hồi quyền cộng tác viên.');
    }
    if (act === 'app-del') {
      const a = state.apps.find(x => x.id === id); if (!a) return;
      if (!(await askConfirm('Xóa đơn đăng ký của "' + a.name + '"? Họ có thể gửi đơn mới sau này.', 'Xóa đơn'))) return;
      await deleteDoc(doc(db, 'applications', id)); toast('Đã xóa đơn.');
    }
    if (act === 'app-clear') {
      const list = state.apps.filter(a => ['rejected', 'revoked'].includes(a.status)); if (!list.length) return;
      if (!(await askConfirm('Xóa vĩnh viễn ' + list.length + ' đơn bị từ chối / đã thu hồi?', 'Xóa hết'))) return;
      await deleteMany(list.map(a => doc(db, 'applications', a.id))); toast('Đã dọn ' + list.length + ' đơn.');
    }
    if (act === 'fb-del') {
      if (!(await askConfirm('Xóa phản hồi này?', 'Xóa'))) return;
      await deleteDoc(doc(db, 'feedback', id)); toast('Đã xóa phản hồi.');
    }
    if (act === 'scan') { state.scanned = true; const n = state.users.filter(isInactive).length; toast(n ? 'Tìm thấy ' + n + ' tài khoản không hoạt động.' : 'Không có tài khoản nào không hoạt động.'); }
    if (act === 'clean') {
      const list = state.users.filter(isInactive); if (!list.length) return;
      if (!(await askConfirm('Xóa vĩnh viễn ' + list.length + ' tài khoản không hoạt động?', 'Xóa hết'))) return;
      await deleteUsers(list); state.scanned = false; state.lastPurge = { n:list.length, at:Date.now() };
      toast('Đã dọn ' + list.length + ' tài khoản không hoạt động.');
    }
    if (act === 'purge') {   // quét + xóa một chạm, có hộp xác nhận
      const list = state.users.filter(isInactive);
      if (!list.length) { state.scanned = false; toast('Không có tài khoản nào cần dọn. Danh sách đã sạch.'); }
      else {
        const names = list.slice(0, 5).map(u => '• ' + u.name).join('\n') + (list.length > 5 ? '\n… và ' + (list.length - 5) + ' tài khoản khác' : '');
        if (!(await askConfirm('Xóa vĩnh viễn ' + list.length + ' tài khoản không online quá ' + state.inactiveDays + ' ngày?\n\n' + names, 'Dọn dẹp'))) return;
        await deleteUsers(list); state.scanned = false; state.lastPurge = { n:list.length, at:Date.now() };
        toast('Đã dọn sạch ' + list.length + ' tài khoản rác. Danh sách user đã gọn gàng.');
      }
    }
  } catch (err) {
    console.error(err); toast('Thao tác thất bại: ' + (err.code || err.message));
  } finally {
    if (b.isConnected) { b.disabled = false; b.style.opacity = ''; }
    softRender();
  }
});

/* ===== 8. Khởi động ===== */
const renderLoading = () => { document.getElementById('app').innerHTML = '<p class="pt-32 text-center muted">Đang tải…</p>'; };
function render() {
  if (!state.profile) { renderLogin(state.loginError); return; }
  renderShell(); renderView();
}
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { setDrawer(false); closeNotices(); } });   // kích hoạt hiệu ứng :active trên iOS
document.addEventListener('change', e => { if (e.target.id === 'inDays') { state.inactiveDays = +e.target.value; state.scanned = false; if (isAdmin()) renderAdmin(); } });
document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { const k = z.dataset.zoom, c = k.lastIndexOf(':'); openViewer(imagesFor(k.slice(0, c)), +k.slice(c + 1)); return; }
  const lk = e.target.closest('[data-like]');
  if (lk) {   // mỗi người 1 like / bài: mảng uid trong bài, bấm lại là bỏ like
    const p = state.posts.find(x => x.id === lk.dataset.like); if (!p || p.status !== 'approved' || !state.me) return;
    const liked = (p.likes || []).includes(state.me); lk.disabled = true;
    updateDoc(doc(db, 'posts', p.id), { likes: liked ? arrayRemove(state.me) : arrayUnion(state.me) })
      .catch(err => { console.error(err); toast('Không thể like: ' + (err.code || err.message)); }).finally(() => { lk.disabled = false; });
    return;
  }
  const tg = e.target.closest('[data-toggle]'); if (tg) { toggleSection(tg.dataset.toggle); return; }
  const sd = e.target.closest('[data-subdel]');
  if (sd) {
    const [key, cid] = sd.dataset.subdel.split('|'), [pid, kind] = key.split(':');
    if (!(await askConfirm(kind === 'sol' ? 'Xóa lời giải này?' : 'Xóa bình luận này?', 'Xóa'))) return;
    try { await deleteDoc(doc(db, 'posts', pid, kind === 'sol' ? 'solutions' : 'comments', cid)); toast('Đã xóa.'); } catch (err) { toast('Không xóa được: ' + (err.code || err.message)); }
    return;
  }
  const dm = e.target.closest('[data-delmine]');
  if (dm) {   // tác giả tự xóa bài của mình (đăng nhầm dạng đề thì xóa đi đăng lại)
    const p = state.posts.find(x => x.id === dm.dataset.delmine); if (!p || p.authorId !== state.me) return;
    if (!(await askConfirm('Xóa bài "' + p.title + '"? Bài cùng lời giải và bình luận kèm theo sẽ mất. Nếu chỉ chọn nhầm dạng đề, bạn có thể đăng lại đúng dạng.', 'Xóa bài'))) return;
    dm.disabled = true;
    try { await deletePostCascade(p.id); toast('Đã xóa bài của bạn. Bạn có thể đăng lại đúng dạng đề.'); } catch (err) { console.error(err); toast('Không xóa được: ' + (err.code || err.message)); dm.disabled = false; }
  }
});
document.addEventListener('focusout', () => {   // gõ xong thì mới cập nhật bảng tin đang chờ
  if (!state.pendingRender) return;
  setTimeout(() => { const ae = document.activeElement; if (!ae || !/^(TEXTAREA|INPUT)$/.test(ae.tagName)) softRender(); }, 200);
});
renderLoading();
if (!FIREBASE_READY) {
  document.getElementById('app').innerHTML = '<main class="px-6 pt-20"><div class="surface rounded-2xl p-6"><h1 class="text-xl font-extrabold">Chưa có cấu hình Firebase</h1><p class="muted text-sm mt-2">Hãy điền <b>firebaseConfig</b> ở đầu file rồi tải lại trang.</p></div></main>';
} else {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp); db = getFirestore(fbApp);
  setPersistence(auth, browserLocalPersistence).catch(() => {});   // giữ đăng nhập khi tải lại trang / mở lại PWA
  getRedirectResult(auth).catch(err => { state.loginError = authErrorText(err); if (!state.profile) renderLogin(state.loginError); });
  onAuthStateChanged(auth, fb => {
    if (fb) onGoogleUser(fb);
    else { stopListeners(); state.me = null; state.profile = null; const m = state.loginError; state.loginError = ''; renderLogin(m); }
  });
}
</script>
</body>
