<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Góc Ôn Thi – Cộng đồng chia sẻ đề</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
  :root {
    --bg:#F3F7F5; --surface:#FFFFFF; --ink:#12332B; --muted:#5B726B; --line:#D9E5E0;
    --pine:#1B5E4B; --pine-ink:#FFFFFF; --gold:#E0A526;
    --berry:#B3202F; --berry-bg:#FDECEE; --berry-line:#F1A7AF;
    --ok-bg:#E3F4EA; --ok:#176B3A; --wait-bg:#FFF3D6; --wait:#8A5A00;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0E1A17; --surface:#16261F; --ink:#E6F1ED; --muted:#98B0A8; --line:#274037;
      --pine:#58C2A1; --pine-ink:#0E1A17; --gold:#E8B545;
      --berry:#FF8A97; --berry-bg:#3A171C; --berry-line:#7A2E38;
      --ok-bg:#16382A; --ok:#7BE0A4; --wait-bg:#3B2F10; --wait:#F1C970;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top,0px); }
  body { background:var(--bg); color:var(--ink); font-family:'Be Vietnam Pro',system-ui,sans-serif; }
  .surface { background:var(--surface); border:1px solid var(--line); }
  .muted { color:var(--muted); }
  .btn-pine { background:var(--pine); color:var(--pine-ink); }
  .btn-pine:disabled { background:var(--line); color:var(--muted); cursor:not-allowed; }
  .btn-danger { background:var(--berry); color:var(--surface); }
  .btn-outline { border:1.5px solid var(--line); color:var(--ink); }
  .field { background:var(--bg); border:1px solid var(--line); color:var(--ink); }
  .field:focus { outline:2px solid var(--pine); outline-offset:1px; }
  .chip { border:1px solid var(--line); background:var(--surface); }
  .chip[aria-pressed="true"] { background:var(--pine); color:var(--pine-ink); border-color:var(--pine); }
  .type-card { border:1.5px solid var(--line); background:var(--surface); }
  .type-card[aria-checked="true"] { border-color:var(--pine); box-shadow:0 0 0 2px var(--pine) inset; }
  .type-card[data-sensitive="true"][aria-checked="true"] { border-color:var(--berry); box-shadow:0 0 0 2px var(--berry) inset; }
  .warn { background:var(--berry-bg); border:1.5px solid var(--berry-line); color:var(--berry); }
  .badge-ok { background:var(--ok-bg); color:var(--ok); }
  .badge-wait { background:var(--wait-bg); color:var(--wait); }
  .badge-bad { background:var(--berry-bg); color:var(--berry); }
  .admin-tag { background:var(--gold); color:#3A2A00; }
  .badge-photo { background:#EADCFF; color:#5B2A9B; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge-photo { background:#2E2050; color:#CDB4FF; } }
  .subj-toan { background:#DCEBFF; color:#1A4E9B; }
  .subj-van { background:#FBE0E6; color:#9A2046; }
  .subj-anh { background:#D5F1EC; color:#0F6B5C; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .subj-toan { background:#16304F; color:#9CC4FF; }
    :root:not([data-theme="light"]) .subj-van { background:#47202B; color:#FFB0C3; }
    :root:not([data-theme="light"]) .subj-anh { background:#12403A; color:#8EE3D3; }
  }
  @media (prefers-reduced-motion: no-preference) { .pop { animation: pop .18s ease-out; } }
  /* ===== Cảm ứng: bỏ trễ chạm, vùng bấm ≥ 44px, phản hồi tức thì ===== */
  html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button, label.chip, select, [role="radio"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; user-select: none; -webkit-user-select: none; }
  button { min-height: 44px; min-width: 44px; }
  button.no-min { min-height: 0; min-width: 0; }
  button.no-min::after { content: ''; position: absolute; inset: -10px; }
  label.chip { min-height: 44px; display: flex; align-items: center; justify-content: center; }
  button:disabled { cursor: not-allowed; }
  button, label.chip, .type-card, [data-zoom] { transition: transform .08s ease-out, opacity .08s ease-out; }
  button:not(:disabled):active, label.chip:active, .type-card:active { transform: scale(.95); opacity: .75; }
  [data-zoom]:active { transform: scale(.97); opacity: .85; }
  @keyframes pop { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
</style>
</head>
<body class="min-h-screen">
<div id="app" class="mx-auto max-w-2xl min-h-screen relative"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 hidden px-4 py-2 rounded-full text-sm font-medium shadow-lg" style="background:var(--ink);color:var(--bg)"></div>

<script>
/* ===== 1. Cấu hình ===== */
const ADMIN_KEYWORD = 'thành thông';           // tên chứa cụm này (không phân biệt hoa/thường) sẽ là admin
const SUBJECTS = { toan:'Toán', van:'Ngữ Văn', anh:'Tiếng Anh' };
const TYPES = {
  practice:{ label:'Đề thi thử / Tự luyện', sensitive:false, hint:'Đăng công khai ngay' },
  semester:{ label:'Đề học kỳ', sensitive:true, hint:'Cần kiểm duyệt' },
  thptqg:{ label:'Đề THPTQG', sensitive:true, hint:'Cần kiểm duyệt' }
};
const MIN = 60000, HOUR = 3600000, DAY = 24 * HOUR;
const roleOf = name => name.normalize('NFC').toLowerCase().includes(ADMIN_KEYWORD) ? 'admin' : 'student';


/* ===== 2. Trạng thái & lưu trữ cục bộ (không cần database) ===== */
const state = { me:null, view:'feed', filter:'all', adminTab:'queue', users:[], posts:[], inactiveDays:30, scanned:false, lastPurge:null };
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('gm3_data') || 'null');
    if (d && Array.isArray(d.users) && Array.isArray(d.posts)) { state.users = d.users; state.posts = d.posts; }
    state.me = localStorage.getItem('gm3_session');
  } catch (e) { state.users = []; state.posts = []; }
}
function save() {
  try {
    localStorage.setItem('gm3_data', JSON.stringify({ users:state.users, posts:state.posts }));
    state.me ? localStorage.setItem('gm3_session', state.me) : localStorage.removeItem('gm3_session');
    return true;
  } catch (e) { return false; }
}
const me = () => state.users.find(u => u.id === state.me) || null;
const isAdmin = () => !!me() && me().role === 'admin';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ts) {
  const d = Date.now() - ts;
  if (d < MIN) return 'Vừa xong';
  if (d < HOUR) return Math.floor(d/MIN) + ' phút trước';
  if (d < 24*HOUR) return Math.floor(d/HOUR) + ' giờ trước';
  return new Date(ts).toLocaleDateString('vi-VN');
}
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2800);
}
const adminTag = '<span class="admin-tag text-[10px] font-extrabold px-1.5 py-0.5 rounded">ADMIN</span>';

/* Hộp xác nhận ngay trong trang (confirm() của trình duyệt hay bị chặn trong khung preview/iframe nên nút tưởng như đơ) */
let lastAct = 0;
function askConfirm(msg, okLabel) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-4';
    wrap.style.background = 'rgba(0,0,0,.6)';
    wrap.innerHTML = `<div class="surface pop rounded-2xl p-5 w-full max-w-sm" role="alertdialog" aria-modal="true"><p class="text-sm whitespace-pre-line">${esc(msg)}</p><div class="mt-4 flex gap-2 justify-end"><button type="button" data-no class="btn-outline rounded-lg px-4 py-2 text-sm font-semibold">Hủy</button><button type="button" data-yes class="btn-danger rounded-lg px-4 py-2 text-sm font-semibold">${esc(okLabel || 'Đồng ý')}</button></div></div>`;
    const done = v => { wrap.remove(); resolve(v); };
    wrap.onclick = e => { if (e.target.closest('[data-yes]')) done(true); else if (e.target === wrap || e.target.closest('[data-no]')) done(false); };
    document.body.appendChild(wrap);
  });
}
/* Cập nhật mềm: chỉ vẽ lại phần nội dung đang xem, giữ nguyên vị trí cuộn, không dựng lại header/thanh điều hướng */
function updatePendingBadge() {
  const b = document.getElementById('navBadge'); if (!b) return;
  const n = state.posts.filter(p => p.status === 'pending').length;
  b.textContent = n; b.classList.toggle('hidden', !n);
}
function softRender() {
  const y = window.scrollY;
  updatePendingBadge();
  if (state.view === 'feed') renderFeed(); else if (state.view === 'admin') renderAdmin();
  window.scrollTo(0, y);
}

/* ===== 3. Đăng nhập: tự nhận diện role theo tên hiển thị ===== */
function renderLogin(errMsg) {
  document.getElementById('app').innerHTML = `
  <main class="px-6 pt-16 pb-10 flex flex-col min-h-screen">
    <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl" style="background:var(--pine)">🎄</div>
    <h1 class="mt-6 text-3xl font-extrabold leading-tight">Góc Ôn Thi</h1>
    <p class="mt-2 muted">Nơi học sinh chia sẻ đề và ôn tập cùng nhau. Toán, Ngữ Văn, Tiếng Anh.</p>
    <div class="mt-10 space-y-4">
      <label class="block">
        <span class="text-sm font-semibold">Tên hiển thị (như tên tài khoản Google)</span>
        <input id="lgName" class="field mt-1 w-full rounded-xl px-4 py-3" placeholder="Ví dụ: Minh Châu" autocomplete="name">
      </label>
      <p id="lgErr" class="text-sm font-medium ${errMsg ? '' : 'hidden'}" style="color:var(--berry)">${esc(errMsg || '')}</p>
      <button id="lgBtn" class="btn-pine w-full rounded-xl py-3.5 font-bold">Đăng nhập</button>
      <p class="text-xs muted text-center">Bản thử nghiệm: dữ liệu lưu trong trình duyệt, chưa có máy chủ.</p>
    </div>
  </main>`;
  const go = () => {
    const name = document.getElementById('lgName').value.trim().replace(/\s+/g, ' ');
    const err = document.getElementById('lgErr');
    if (name.length < 2) { err.textContent = 'Nhập tên hiển thị (ít nhất 2 ký tự).'; err.classList.remove('hidden'); return; }
    let u = state.users.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (u && u.banned) { renderLogin('Tài khoản này đã bị khóa vĩnh viễn do vi phạm quy chế thi cử.'); return; }
    if (!u) { u = { id:'u' + Date.now(), name, role:roleOf(name), banned:false, joined:Date.now() }; state.users.push(u); }
    u.role = roleOf(u.name);                       // gán lại role mỗi lần đăng nhập
    u.lastActive = Date.now(); state.me = u.id; state.view = 'feed'; save(); render();
  };
  document.getElementById('lgBtn').onclick = go;
  document.getElementById('lgName').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ===== 4. Khung chính ===== */
function renderShell() {
  const u = me(), admin = isAdmin();
  const navs = [['feed','Bảng tin'], ['post','Đăng bài']].concat(admin ? [['admin','Quản trị']] : []);
  const pendingN = state.posts.filter(p => p.status === 'pending').length;
  document.getElementById('app').innerHTML = `
  <header class="sticky top-0 z-30 px-4 py-1 flex items-center justify-between" style="background:var(--bg);border-bottom:1px solid var(--line);padding-top:calc(.25rem + env(safe-area-inset-top,0px))">
    <div class="flex items-center gap-2"><span class="text-xl">🎄</span><span class="font-extrabold">Góc Ôn Thi</span></div>
    <div class="flex items-center gap-2 text-sm">
      <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold" style="background:var(--gold);color:#3A2A00">${esc(u.name[0].toUpperCase())}</span>
      <span class="font-semibold max-w-[8rem] truncate">${esc(u.name)}</span>${admin ? adminTag : ''}
      <button id="logout" class="muted ml-1" aria-label="Đăng xuất">Thoát</button>
    </div>
  </header>
  <div id="view" class="pb-28"></div>
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-2xl z-30 grid" style="grid-template-columns:repeat(${navs.length},1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)">
    ${navs.map(([k,l]) => `<button data-nav="${k}" class="py-3 text-sm font-semibold">${l}${k==='admin' ? ` <span id="navBadge" class="badge-bad text-xs rounded-full px-1.5 ${pendingN ? '' : 'hidden'}">${pendingN}</span>` : ''}</button>`).join('')}
  </nav>`;
  document.getElementById('logout').onclick = () => { state.me = null; save(); render(); };
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { state.view = b.dataset.nav; renderView(); });
}
function renderView() {
  if (state.view === 'admin' && !isAdmin()) state.view = 'feed';      // chặn học sinh vào trang admin
  document.querySelectorAll('[data-nav]').forEach(b => {
    const on = b.dataset.nav === state.view;
    b.style.color = on ? 'var(--pine)' : 'var(--muted)';
    b.style.boxShadow = on ? 'inset 0 2px 0 var(--pine)' : 'none';
  });
  ({ feed:renderFeed, post:renderPostForm, admin:renderAdmin })[state.view]();
  window.scrollTo(0, 0);
}

/* ===== 5. Bảng tin ===== */
function postBadges(p) {
  const t = TYPES[p.type], ok = p.status === 'approved';
  return `<div class="flex flex-wrap gap-1.5 mb-2">
    <span class="subj-${p.subject} text-xs font-semibold px-2.5 py-1 rounded-full">${SUBJECTS[p.subject]}</span>
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${t.sensitive ? 'badge-bad' : ''}" style="${t.sensitive ? '' : 'background:var(--bg);color:var(--muted)'}">${t.label}</span>
    <span class="${ok ? 'badge-ok' : 'badge-wait'} text-xs font-semibold px-2.5 py-1 rounded-full">${ok ? 'Đã duyệt' : 'Đang chờ kiểm duyệt'}</span>${(p.images && p.images.length) ? '<span class="badge-photo text-xs font-semibold px-2.5 py-1 rounded-full">📷 Đã có ảnh chụp</span>' : ''}</div>`;
}
function thumbs(p) {
  if (!p.images || !p.images.length) return '';
  return `<div class="mt-3 grid grid-cols-3 gap-2">${p.images.map((src, i) => `<button type="button" data-zoom="${esc(p.id)}:${i}" class="block rounded-lg overflow-hidden" style="aspect-ratio:1/1;border:1px solid var(--line)" aria-label="Xem ảnh chụp đề thi ${i + 1}"><img src="${esc(src)}" alt="Ảnh chụp đề thi ${i + 1}" class="w-full h-full object-cover"></button>`).join('')}</div>`;
}
const byline = p => `<span class="font-semibold">${esc(p.author)}</span> ${p.authorRole === 'admin' ? adminTag : ''} · ${ago(p.ts)}`;
function renderFeed() {
  const count = n => state.posts.filter(p => n === 'all' || p.subject === n).length;
  const list = state.posts.filter(p => state.filter === 'all' || p.subject === state.filter);
  document.getElementById('view').innerHTML = `
  <section class="px-4 pt-4">
    <h2 class="text-xl font-extrabold">Chào ${esc(me().name)}, hôm nay ôn gì?</h2>
    <div class="mt-3 flex gap-2 overflow-x-auto pb-1" role="group" aria-label="Lọc theo môn">
      ${[['all','Tất cả'], ...Object.entries(SUBJECTS)].map(([k,v]) => `<button class="chip shrink-0 rounded-full px-4 py-1.5 text-sm font-semibold" data-f="${k}" aria-pressed="${state.filter === k}">${v} (${count(k)})</button>`).join('')}
    </div>
    <div class="mt-4 space-y-3">
      ${list.length ? list.map(p => `<article class="surface rounded-2xl p-4">${postBadges(p)}
        <h3 class="font-bold leading-snug">${esc(p.title)}</h3>
        <p class="text-sm muted mt-1.5">${esc(p.body)}</p>${thumbs(p)}
        <p class="text-xs muted mt-3">${byline(p)}</p></article>`).join('')
        : state.posts.length
          ? `<div class="surface rounded-2xl p-6 text-center"><p class="font-semibold">Chưa có bài nào ở môn này</p><p class="text-sm muted mt-1">Hãy là người đầu tiên chia sẻ một đề.</p></div>`
          : `<div class="surface rounded-2xl p-8 text-center"><p class="font-semibold">Chưa có đề thi nào được chia sẻ.</p><p class="text-sm muted mt-1">Hãy là người đầu tiên đóng góp!</p></div>`}
    </div>
  </section>`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { state.filter = b.dataset.f; renderFeed(); });
}

/* ===== 6. Form đăng bài + Zero Tolerance ===== */
function renderPostForm() {
  document.getElementById('view').innerHTML = `
  <section class="px-4 pt-4 space-y-5">
    <h2 class="text-xl font-extrabold">Đăng đề mới</h2>
    <label class="block"><span class="text-sm font-semibold">Tiêu đề</span>
      <input id="fTitle" class="field mt-1 w-full rounded-xl px-4 py-3" placeholder="Ví dụ: Đề thi thử Toán chương Hàm số" maxlength="120"></label>
    <div><span class="text-sm font-semibold">Môn học</span>
      <div class="mt-1 grid grid-cols-3 gap-2" id="fSubject">
        ${Object.entries(SUBJECTS).map(([k,v],i) => `<label class="chip rounded-xl py-2.5 text-center text-sm font-semibold cursor-pointer"><input type="radio" name="subj" value="${k}" class="sr-only" ${i===0?'checked':''}>${v}</label>`).join('')}
      </div></div>
    <div><span class="text-sm font-semibold">Loại đề</span>
      <div class="mt-1 space-y-2" role="radiogroup">
        ${Object.entries(TYPES).map(([k,t],i) => `<button type="button" role="radio" data-type="${k}" data-sensitive="${t.sensitive}" aria-checked="${i===0}" class="type-card w-full text-left rounded-xl px-4 py-3 flex items-center justify-between">
          <span class="font-semibold text-sm">${t.label}</span>
          <span class="text-xs font-medium" style="color:${t.sensitive ? 'var(--berry)' : 'var(--ok)'}">${t.hint}</span></button>`).join('')}
      </div></div>
    <div id="zeroBox"></div>
    <label class="block"><span class="text-sm font-semibold">Mô tả / nội dung</span>
      <textarea id="fBody" rows="4" class="field mt-1 w-full rounded-xl px-4 py-3" placeholder="Giới thiệu ngắn về đề, số câu, mức độ, có đáp án hay không…"></textarea></label>
    <div>
      <span class="text-sm font-semibold">Ảnh chụp đề thi thực tế <span class="muted font-normal">(tùy chọn, tối đa 3 ảnh)</span></span>
      <p class="text-xs muted mt-1">Bài kèm ảnh chụp đề thật được gắn nhãn "Đã có ảnh chụp", giúp mọi người tin cậy và admin duyệt nhanh hơn. Chỉ chụp sau khi kỳ thi đã kết thúc.</p>
      <input id="fFile" type="file" accept="image/*" multiple class="sr-only">
      <button id="fPick" type="button" class="btn-outline w-full rounded-xl py-3 mt-2 text-sm font-semibold">📷 Chụp / chọn ảnh đề thi</button>
      <div id="fThumbs" class="grid grid-cols-3 gap-2 mt-2"></div>
    </div>
    <p id="fErr" class="text-sm hidden" style="color:var(--berry)"></p>
    <button id="fSubmit" class="btn-pine w-full rounded-xl py-3.5 font-bold">Đăng bài</button>
  </section>`;

  let type = 'practice', agreed = false, images = [];
  const MAX_IMG = 3;
  const renderThumbs = () => {
    document.getElementById('fThumbs').innerHTML = images.map((src, i) => `<div class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1;border:1px solid var(--line)"><img src="${src}" alt="Ảnh ${i + 1}" class="w-full h-full object-cover"><button type="button" data-rm="${i}" class="no-min btn-danger absolute top-1 right-1 w-7 h-7 rounded-full text-xs font-bold" aria-label="Xóa ảnh ${i + 1}">✕</button></div>`).join('');
    const pick = document.getElementById('fPick');
    pick.textContent = images.length ? `📷 Thêm ảnh (${images.length}/${MAX_IMG})` : '📷 Chụp / chọn ảnh đề thi';
    pick.disabled = images.length >= MAX_IMG;
    pick.style.opacity = pick.disabled ? '.5' : '1';
  };
  const compress = file => new Promise((resolve, reject) => {   // thu nhỏ ảnh để vừa bộ nhớ trình duyệt
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
  document.getElementById('fPick').onclick = () => document.getElementById('fFile').click();
  document.getElementById('fFile').onchange = async e => {
    const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
    e.target.value = '';
    for (const f of files) {
      if (images.length >= MAX_IMG) { toast('Tối đa 3 ảnh cho mỗi bài.'); break; }
      try { images.push(await compress(f)); } catch (err) { toast('Không đọc được ảnh "' + f.name + '".'); }
    }
    renderThumbs();
  };
  document.getElementById('fThumbs').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { images.splice(+b.dataset.rm, 1); renderThumbs(); } };
  renderThumbs();
  const subjChips = () => document.querySelectorAll('#fSubject label').forEach(l => {
    const on = l.querySelector('input').checked;
    l.style.background = on ? 'var(--pine)' : 'var(--surface)'; l.style.color = on ? 'var(--pine-ink)' : 'var(--ink)'; l.style.borderColor = on ? 'var(--pine)' : 'var(--line)';
  });
  subjChips();
  document.querySelectorAll('#fSubject input').forEach(i => i.onchange = subjChips);

  const updateBtn = () => {
    const btn = document.getElementById('fSubmit'), sens = TYPES[type].sensitive, blocked = sens && !agreed;
    btn.disabled = blocked;
    btn.textContent = blocked ? 'Tích xác nhận để đăng bài' : (sens && !isAdmin() ? 'Gửi kiểm duyệt' : 'Đăng bài');
  };
  const sync = () => {
    const box = document.getElementById('zeroBox');
    document.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-checked', b.dataset.type === type));
    if (TYPES[type].sensitive) {
      box.innerHTML = `<div class="warn pop rounded-2xl p-4" role="alert">
        <p class="font-extrabold">Cảnh báo: không khoan nhượng với gian lận thi cử</p>
        <p class="text-sm mt-1.5" style="color:var(--ink)">Đăng đề khi kỳ thi chưa kết thúc là vi phạm quy chế và sẽ bị khóa tài khoản vĩnh viễn. Bài thuộc nhóm này luôn được kiểm duyệt trước khi hiển thị.</p>
        <label class="mt-3 flex items-start gap-3 cursor-pointer">
          <input id="zeroChk" type="checkbox" class="mt-1 w-5 h-5 shrink-0" style="accent-color:var(--berry)">
          <span class="text-sm font-semibold" style="color:var(--ink)">Tôi xác nhận kỳ thi đã kết thúc hoàn toàn và tôi đã rời khỏi phòng thi</span></label></div>`;
      document.getElementById('zeroChk').onchange = e => { agreed = e.target.checked; updateBtn(); };
    } else { box.innerHTML = ''; }
    updateBtn();
  };
  document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { type = b.dataset.type; agreed = false; sync(); });

  document.getElementById('fSubmit').onclick = () => {
    const title = document.getElementById('fTitle').value.trim(), body = document.getElementById('fBody').value.trim(), err = document.getElementById('fErr');
    if (!title || !body) { err.textContent = 'Điền tiêu đề và mô tả trước khi đăng.'; err.classList.remove('hidden'); return; }
    if (TYPES[type].sensitive && !agreed) return;
    const u = me(), pending = TYPES[type].sensitive && u.role !== 'admin';   // admin đăng thì duyệt luôn
    state.posts.unshift({ id:'p' + Date.now(), title, body, type, subject:document.querySelector('input[name="subj"]:checked').value,
      status: pending ? 'pending' : 'approved', authorId:u.id, author:u.name, authorRole:u.role, ts:Date.now(), images:images.slice() });
    u.lastActive = Date.now();
    if (!save()) {   // bộ nhớ trình duyệt đầy: hoàn tác và báo lỗi
      state.posts.shift();
      err.textContent = 'Bộ nhớ trình duyệt đã đầy nên chưa lưu được bài. Hãy bỏ bớt ảnh rồi thử lại.'; err.classList.remove('hidden'); return;
    }
    state.view = 'feed'; state.filter = 'all'; render();
    toast(pending ? 'Đã gửi. Bài sẽ hiện sau khi được kiểm duyệt.' : 'Đã đăng bài công khai.');
  };
  sync();
}

/* ===== 7. Trang Quản Trị Admin (chỉ role = admin) ===== */
function renderAdmin() {
  const pending = state.posts.filter(p => p.status === 'pending').sort((a,b) => b.ts - a.ts);
  const tabBtn = (k, l, n) => `<button data-at="${k}" class="chip rounded-full px-4 py-1.5 text-sm font-semibold" aria-pressed="${state.adminTab === k}">${l} (${n})</button>`;
  document.getElementById('view').innerHTML = `
  <section class="px-4 pt-4">
    <div class="flex items-center gap-2"><h2 class="text-xl font-extrabold">Trang Quản Trị Admin</h2>${adminTag}</div>
    <p class="text-sm muted mt-1">Xin chào ${esc(me().name)}. Duyệt bài nhạy cảm và xử lý tài khoản vi phạm tại đây.</p>
    <div class="mt-3 flex gap-2">${tabBtn('queue', 'Kiểm duyệt đề thi', pending.length)}${tabBtn('users', 'Quản lý tài khoản', state.users.length)}</div>
    <div class="mt-4 space-y-3" id="adminBody">${state.adminTab === 'queue' ? adminQueue(pending) : adminUsers()}</div>
  </section>`;
}
function adminQueue(pending) {
  if (!pending.length) return `<div class="surface rounded-2xl p-6 text-center"><p class="font-semibold">Hàng đợi trống</p><p class="text-sm muted mt-1">Không có bài nào đang chờ kiểm duyệt.</p></div>`;
  return pending.map(p => `<article class="surface rounded-2xl p-4">${postBadges(p)}
    <h3 class="font-bold leading-snug">${esc(p.title)}</h3>
    <p class="text-sm mt-1.5 whitespace-pre-line">${esc(p.body)}</p>${thumbs(p)}
    ${(p.images && p.images.length) ? '' : (TYPES[p.type].sensitive ? '<p class="text-xs mt-2 font-semibold" style="color:var(--wait)">Bài không kèm ảnh chụp đề: cân nhắc kỹ trước khi duyệt.</p>' : '')}
    <p class="text-xs muted mt-3">Người đăng: ${byline(p)}</p>
    <div class="mt-3 pt-3 flex gap-2 justify-end" style="border-top:1px solid var(--line)">
      <button data-act="del" data-id="${esc(p.id)}" class="btn-outline rounded-lg px-4 py-2 text-sm font-semibold" style="color:var(--berry);border-color:var(--berry)">Xóa</button>
      <button data-act="ok" data-id="${esc(p.id)}" class="btn-pine rounded-lg px-4 py-2 text-sm font-semibold">Duyệt</button>
    </div></article>`).join('');
}
const lastActiveOf = u => u.lastActive || u.joined;
const seen = u => { const d = Date.now() - lastActiveOf(u); return d < DAY ? ago(lastActiveOf(u)) : Math.floor(d / DAY) + ' ngày trước'; };
// Không dọn: Admin, chính bạn, và tài khoản đang bị khóa (xóa sẽ giúp họ đăng ký lại để né lệnh cấm)
const isInactive = u => u.role !== 'admin' && !u.banned && u.id !== state.me && (Date.now() - lastActiveOf(u)) > state.inactiveDays * DAY;
function cleanupPanel() {
  const list = state.users.filter(isInactive);
  const opts = [7, 14, 30, 60, 90].map(d => `<option value="${d}" ${state.inactiveDays === d ? 'selected' : ''}>Trên ${d} ngày</option>`).join('');
  const result = !state.scanned ? '' : list.length
    ? `<div class="mt-3 pt-3" style="border-top:1px solid var(--line)"><p class="text-sm font-semibold">Tìm thấy ${list.length} tài khoản không hoạt động trên ${state.inactiveDays} ngày:</p>
        <ul class="text-xs muted mt-1 space-y-0.5">${list.map(u => `<li>${esc(u.name)} · hoạt động cuối ${seen(u)}</li>`).join('')}</ul>
        <button data-act="clean" class="btn-danger rounded-lg px-4 py-2 text-sm font-semibold mt-3">Xóa tài khoản không hoạt động (${list.length})</button></div>`
    : `<p class="text-sm font-semibold mt-3 pt-3" style="border-top:1px solid var(--line);color:var(--ok)">Không có tài khoản nào không hoạt động. Danh sách đang sạch.</p>`;
  return `<div class="surface rounded-2xl p-4">
    <p class="font-bold">Dọn tài khoản ngủ quên</p>
    <p class="text-xs muted mt-1">Lọc các tài khoản lâu không hoạt động. Admin, tài khoản của bạn và tài khoản đã bị khóa luôn được giữ lại. Bài đã đăng vẫn được giữ nguyên.</p>
    <div class="mt-3 flex flex-wrap items-center gap-2">
      <select id="inDays" class="field rounded-lg px-3 py-2 text-sm" aria-label="Ngưỡng không hoạt động">${opts}</select>
      <button data-act="scan" class="btn-outline rounded-lg px-4 py-2 text-sm font-semibold">Xem trước danh sách</button>
    </div>
    <button data-act="purge" class="btn-danger w-full rounded-xl py-3 mt-3 text-sm font-bold">Dọn dẹp tài khoản không hoạt động (>${state.inactiveDays} ngày không online)</button>${state.lastPurge ? `<p class="text-xs mt-2 font-semibold" style="color:var(--ok)">Lần dọn gần nhất: đã xóa ${state.lastPurge.n} tài khoản (${new Date(state.lastPurge.at).toLocaleString('vi-VN')}).</p>` : ''}${result}
    <button data-act="seedold" class="mt-3 text-xs muted underline">Tạo 3 tài khoản thử đã ngủ quên (chỉ để test tính năng)</button>
  </div>`;
}
function adminUsers() {
  return cleanupPanel() + state.users.slice().sort((a,b) => b.joined - a.joined).map(u => {
    const n = state.posts.filter(p => p.authorId === u.id).length, self = u.id === state.me;
    const act = u.role === 'admin' ? '<span class="text-xs muted">Không thể khóa</span>'
      : u.banned ? `<button data-act="unban" data-id="${esc(u.id)}" class="btn-outline rounded-lg px-3 py-1.5 text-xs font-semibold">Mở khóa (Unban)</button>`
      : `<button data-act="ban" data-id="${esc(u.id)}" class="btn-danger rounded-lg px-3 py-1.5 text-xs font-semibold">Khóa vĩnh viễn (Ban)</button>`;
    return `<div class="surface rounded-2xl p-4 flex items-center justify-between gap-3">
      <div class="min-w-0"><p class="font-semibold truncate">${esc(u.name)} ${u.role === 'admin' ? adminTag : ''}${self ? ' <span class="text-xs muted">(bạn)</span>' : ''}</p>
        <p class="text-xs muted mt-0.5">${n} bài · tham gia ${new Date(u.joined).toLocaleDateString('vi-VN')} · hoạt động cuối ${seen(u)} · <span class="${u.banned ? 'badge-bad' : 'badge-ok'} px-1.5 py-0.5 rounded-full font-semibold">${u.banned ? 'Đã khóa' : 'Hoạt động'}</span>${isInactive(u) ? ' <span class="badge-wait px-1.5 py-0.5 rounded-full font-semibold">Ngủ quên</span>' : ''}</p></div>
      ${act}</div>`;
  }).join('');
}
document.getElementById('app').addEventListener('click', async e => {
  const at = e.target.closest('[data-at]');
  if (at && isAdmin()) { state.adminTab = at.dataset.at; renderAdmin(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || !isAdmin()) return;                      // mọi thao tác admin đều kiểm tra lại role
  if (Date.now() - lastAct < 300) return;   // chống bấm đúp: danh sách dịch lên sẽ không trúng nhầm bài kế tiếp
  lastAct = Date.now();
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'ok') { const p = state.posts.find(x => x.id === id); if (p) { p.status = 'approved'; toast('Đã duyệt. Bài đã lên bảng tin chung.'); } }
  if (act === 'del') { if (!(await askConfirm('Xóa vĩnh viễn bài viết này?', 'Xóa'))) return; state.posts = state.posts.filter(x => x.id !== id); toast('Đã xóa bài viết vi phạm.'); }
  if (act === 'ban') { const u = state.users.find(x => x.id === id); if (u && u.role !== 'admin' && await askConfirm('Khóa vĩnh viễn tài khoản "' + u.name + '"?', 'Khóa vĩnh viễn')) { u.banned = true; toast('Đã khóa tài khoản.'); } else return; }
  if (act === 'unban') { const u = state.users.find(x => x.id === id); if (u) { u.banned = false; toast('Đã mở khóa tài khoản.'); } }
  if (act === 'scan') { state.scanned = true; const n = state.users.filter(isInactive).length; toast(n ? 'Tìm thấy ' + n + ' tài khoản không hoạt động.' : 'Không có tài khoản nào không hoạt động.'); }
  if (act === 'clean') {
    const list = state.users.filter(isInactive); if (!list.length) return;
    if (!(await askConfirm('Xóa vĩnh viễn ' + list.length + ' tài khoản không hoạt động?', 'Xóa hết'))) return;
    const ids = new Set(list.map(u => u.id)); state.users = state.users.filter(u => !ids.has(u.id)); state.scanned = false;
    state.lastPurge = { n:list.length, at:Date.now() };
    toast('Đã dọn ' + list.length + ' tài khoản không hoạt động.');
  }
  if (act === 'purge') {   // quét + xóa một chạm, có hộp xác nhận
    const list = state.users.filter(isInactive);
    if (!list.length) { state.scanned = false; toast('Không có tài khoản nào cần dọn. Danh sách đã sạch.'); }
    else {
      const names = list.slice(0, 5).map(u => '• ' + u.name).join('\n') + (list.length > 5 ? '\n… và ' + (list.length - 5) + ' tài khoản khác' : '');
      if (!(await askConfirm('Xóa vĩnh viễn ' + list.length + ' tài khoản không online quá ' + state.inactiveDays + ' ngày?\n\n' + names, 'Dọn dẹp'))) return;
      const ids = new Set(list.map(u => u.id)); state.users = state.users.filter(u => !ids.has(u.id));
      state.scanned = false; state.lastPurge = { n:list.length, at:Date.now() };
      toast('Đã dọn sạch ' + list.length + ' tài khoản rác. Danh sách user đã gọn gàng.');
    }
  }
  if (act === 'seedold') {   // chỉ tạo khi bấm: để thử tính năng dọn rác, không có sẵn khi mở trang
    const t = Date.now();
    [45, 70, 100].forEach((d, i) => state.users.push({ id:'t' + t + i, name:'Tài khoản thử ' + (i + 1), role:'student', banned:false, joined:t - (d + 20) * DAY, lastActive:t - d * DAY }));
    state.scanned = false; toast('Đã tạo 3 tài khoản thử để test dọn rác.');
  }
  save(); softRender();
});

/* ===== 8. Khởi động ===== */
function render() {
  const u = me();
  if (!u || u.banned) { if (u && u.banned) state.me = null; renderLogin(); return; }
  u.role = roleOf(u.name);
  renderShell(); renderView();
}
document.addEventListener('touchstart', () => {}, { passive: true });   // kích hoạt hiệu ứng :active trên iOS
document.addEventListener('change', e => { if (e.target.id === 'inDays') { state.inactiveDays = +e.target.value; state.scanned = false; if (isAdmin()) renderAdmin(); } });
document.addEventListener('click', e => {   // phóng to ảnh chụp đề
  const z = e.target.closest('[data-zoom]');
  if (!z) return;
  const [pid, idx] = z.dataset.zoom.split(':');
  const p = state.posts.find(x => x.id === pid), src = p && p.images && p.images[+idx];
  if (!src || !String(src).startsWith('data:image/')) return;
  const box = document.createElement('div');
  box.className = 'fixed inset-0 z-[60] flex items-center justify-center p-4';
  box.style.background = 'rgba(0,0,0,.92)';
  box.innerHTML = `<img src="${esc(src)}" alt="Ảnh chụp đề thi" class="max-w-full max-h-full rounded-lg"><button type="button" class="absolute right-4 text-white text-2xl" style="top:calc(1rem + env(safe-area-inset-top,0px))" aria-label="Đóng">✕</button>`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
});
load();
{ const m = me(); if (m && !m.banned) { m.lastActive = Date.now(); save(); } }   // mở lại trang cũng tính là hoạt động
render();
</script>
</body>
</html>
